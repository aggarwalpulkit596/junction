name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (3D pages, server engine, site)
        run: npm run build
      - name: Generated files are committed and up to date
        run: git diff --exit-code -- junction3d.html junction3d-saboteur.html tools3d/junction3d-saboteur.template.html worker/rules.gen.js
      - name: Online engine balance and no-stall checks
        run: npm run sim
