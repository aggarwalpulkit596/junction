<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Junction 3D: Saboteur Express</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#bfe4f6;--panel:#ffffff;--ink:#1c1d33;--muted:#575b78;--outline:#1c1d33;--line:#d4d9e8;
  --sea:#6fc3ea;--wave:rgba(255,255,255,.4);--land:#f3df9f;--accent:#ffc933;--accentInk:#1c1d33;
  --danger:#e5484d;--good:#0f9e86;--card:#eef2fa;--scrim:rgba(28,29,51,.5);--lbl:#1c1d33;--halo:#f3df9f;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151834;--panel:#22264d;--ink:#f1f2ff;--muted:#a6aad0;--outline:#0a0b1e;--line:#353a70;
    --sea:#1e3c78;--wave:rgba(255,255,255,.09);--land:#4b6b47;--accent:#ffc933;--accentInk:#1c1d33;
    --danger:#ff5c63;--good:#34d3b2;--card:#2c3060;--scrim:rgba(5,6,20,.65);--lbl:#f6f7ff;--halo:#253a24;
  }
}
:root[data-theme="dark"]{
  --bg:#151834;--panel:#22264d;--ink:#f1f2ff;--muted:#a6aad0;--outline:#0a0b1e;--line:#353a70;
  --sea:#1e3c78;--wave:rgba(255,255,255,.09);--land:#4b6b47;--accent:#ffc933;--accentInk:#1c1d33;
  --danger:#ff5c63;--good:#34d3b2;--card:#2c3060;--scrim:rgba(5,6,20,.65);--lbl:#f6f7ff;--halo:#253a24;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:600;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:600px;margin:0 auto;padding:12px 12px 40px}
h1,h2,h3,.fd{font-family:'Fredoka','Nunito',system-ui,sans-serif}

header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 2px 12px}
.brand{display:flex;gap:10px;align-items:center}
.brand svg{width:34px;height:46px}
h1{font-size:28px;font-weight:700;line-height:1}
.sub{font-size:13px;color:var(--muted);margin-top:3px}
.iconbtn{width:42px;height:42px;border-radius:50%;border:2.5px solid var(--outline);background:var(--panel);font-family:'Fredoka';font-weight:700;font-size:18px;box-shadow:0 3px 0 var(--outline)}

.roster{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:9px}
.mate{background:var(--panel);border:2.5px solid var(--outline);border-radius:14px;padding:6px 3px 7px;text-align:center;box-shadow:0 3px 0 var(--outline);transition:transform .15s}
.mate.turn{background:var(--accent);color:var(--accentInk);transform:translateY(-2px)}
.mate svg{width:24px;height:33px;display:block;margin:0 auto 1px}
.mate .nm{font-family:'Fredoka';font-weight:600;font-size:14px;line-height:1.1}
.mate .meta{font-size:11px;line-height:1.3;opacity:.8}

.status{border-radius:14px;padding:10px 13px;font-size:14.5px;font-weight:700;background:var(--panel);border:2.5px solid var(--outline);margin-bottom:9px;min-height:46px;display:flex;align-items:center;gap:10px;box-shadow:0 3px 0 var(--outline)}
.status .dot{width:12px;height:12px;border-radius:50%;background:var(--good);border:2px solid var(--outline);flex:none}
.status.wait{color:var(--muted)}
.status.wait .dot{background:var(--accent)}
.status.final .dot{background:var(--danger)}

.mapwrap{position:relative;border:2.5px solid var(--outline);border-radius:18px;overflow:hidden;margin-bottom:11px;box-shadow:0 4px 0 var(--outline);background:var(--sea)}
.mapscroll{overflow:auto;-webkit-overflow-scrolling:touch}
#map{display:block;width:100%;height:auto;touch-action:pan-x pan-y}
.zoomed #map{width:230%}
.zoom{position:absolute;right:8px;top:8px;z-index:2;border:2.5px solid var(--outline);background:var(--panel);border-radius:10px;padding:4px 10px;font-family:'Fredoka';font-weight:600;font-size:13px;box-shadow:0 2px 0 var(--outline)}
.land{fill:var(--land);stroke:var(--outline);stroke-width:1.5;stroke-linejoin:round}
.seafill{fill:var(--sea)}
.blacksea{fill:var(--sea);stroke:var(--outline);stroke-width:1.5;stroke-linejoin:round}
.wavepath{fill:none;stroke:var(--wave);stroke-width:1.4;stroke-linecap:round}
.car{stroke:var(--outline);stroke-width:1.1;fill-opacity:.8}
.car.own{fill-opacity:1;stroke-width:1.5}
.car.tun{stroke-dasharray:2.2 1.3}
.car.own.tun{stroke-dasharray:none}
.locomark{fill:#fff;stroke:var(--outline);stroke-width:.9}
.win{fill:#fff;opacity:.9}
.hit{stroke:transparent;stroke-width:13;cursor:pointer}
.selglow{stroke:var(--accent);stroke-width:12;stroke-linecap:round;opacity:.85}
.cityhit{fill:transparent}
.city{cursor:pointer}
.node{fill:#fff;stroke:var(--outline);stroke-width:1.8}
.node.stamped{fill:var(--accent)}
.station{stroke:var(--outline);stroke-width:1.1;stroke-linejoin:round}
.lbl{font-family:'Nunito',sans-serif;font-size:7.6px;font-weight:800;fill:var(--lbl);paint-order:stroke;stroke:var(--halo);stroke-width:2.6px;stroke-linejoin:round;pointer-events:none}

.panel{background:var(--panel);border:2.5px solid var(--outline);border-radius:16px;padding:11px 12px 13px;margin-bottom:11px;box-shadow:0 4px 0 var(--outline)}
.ph{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:8px}
h2{font-size:17px;font-weight:600}
.hint{font-size:12.5px;color:var(--muted)}
.cards{display:flex;flex-wrap:wrap;gap:9px}
.cardface{width:48px;height:64px;border-radius:10px;background:var(--c);border:2.5px solid var(--outline);box-shadow:0 3px 0 var(--outline);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;position:relative}
.cardface svg{width:30px;height:20px}
.cardface .cl{font-size:10px;font-weight:800;color:#1c1d33;background:rgba(255,255,255,.85);border-radius:6px;padding:0 5px;line-height:15px}
.cardface.loco{background:conic-gradient(from 30deg,#ef4f4f,#ff8c2e,#ffd23f,#3fbf5f,#3d7dfa,#a35cf0,#ef4f4f)}
.cardface .n{position:absolute;top:-9px;right:-9px;background:var(--outline);color:#fff;border-radius:12px;min-width:23px;height:23px;font-size:12px;display:grid;place-items:center;padding:0 6px;border:2px solid var(--panel)}
.cardface.deck{background:repeating-linear-gradient(45deg,var(--card),var(--card) 5px,var(--line) 5px,var(--line) 10px)}
.cardface.empty{background:transparent;box-shadow:none;border-style:dashed;opacity:.5}
button.mk{background:none;border:none;padding:0;border-radius:10px}
button.mk:active:not(:disabled) .cardface{transform:translateY(2px);box-shadow:0 1px 0 var(--outline)}
button.mk:disabled{opacity:.38;cursor:default}
.handrow{display:flex;flex-wrap:wrap;gap:12px;padding-top:6px}

.btn{display:flex;align-items:center;gap:6px;padding:12px 14px;border-radius:13px;border:2.5px solid var(--outline);background:var(--card);font-weight:800;font-size:15px;text-align:left;box-shadow:0 3px 0 var(--outline)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--outline)}
.btn:disabled{opacity:.45;cursor:default}
.btn.full{width:100%;justify-content:center;margin-top:10px}
.btn.primary{background:var(--accent);color:var(--accentInk)}
.btn.sel{background:var(--accent);color:var(--accentInk)}
.tickbtn{margin-top:12px;width:100%;justify-content:center}

.tix{display:flex;flex-direction:column;gap:8px}
.ticket{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;font-weight:800;padding:9px 11px;border-radius:12px;background:var(--card);border:2px dashed var(--line)}
.ticket.ok{border:2px solid var(--good)}
.ticket .pts{font-family:'Fredoka';font-weight:700;font-size:17px}
.ticket.ok .pts{color:var(--good)}
.tag{font-size:10.5px;font-weight:800;background:var(--outline);color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}

#log{list-style:none;padding:0;display:flex;flex-direction:column;gap:7px;font-size:13.5px;line-height:1.4;font-weight:600}
#log li{padding-left:10px;border-left:3px solid var(--line)}
#log li.danger{border-color:var(--danger)}
#log li.good{border-color:var(--good)}

.overlay{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.overlay.hidden{display:none}
.sheet{background:var(--panel);width:100%;max-width:600px;border-radius:24px 24px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;border:2.5px solid var(--outline);border-bottom:none;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(28px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.mate{transition:none}}
.sheet h3{font-size:24px;font-weight:700;line-height:1.15;margin-bottom:8px}
.kicker{font-size:13px;color:var(--muted);font-weight:800;margin:4px 0 6px}
.sheet p{font-size:15px;margin-bottom:12px;max-width:62ch}
.sheet p.small{font-size:13px;color:var(--muted);margin-top:10px}
.sheet ul{padding-left:18px;margin-bottom:12px;font-size:14.5px}
.sheet li{margin-bottom:7px}
.note{padding:11px 12px;border-radius:12px;background:var(--card);font-size:14.5px;margin:4px 0 4px}
.payopts{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:9px}
.sw{display:inline-block;width:16px;height:16px;border-radius:5px;border:2px solid var(--outline);flex:none}
.sw.swloco{background:conic-gradient(#ef4f4f,#ff8c2e,#ffd23f,#3fbf5f,#3d7dfa,#a35cf0,#ef4f4f)}
.plus{margin:0 4px;opacity:.6}
.postcard{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.pcE{font-size:34px;width:60px;height:60px;border-radius:14px;background:var(--card);border:2.5px solid var(--outline);display:grid;place-items:center;flex:none}
.stamp{display:inline-block;font-size:11px;font-weight:800;color:var(--good);border:2px solid var(--good);border-radius:6px;padding:0 6px;margin-left:6px;transform:rotate(-4deg)}
.reveal{display:flex;gap:10px;margin:6px 0 12px}
.reveal .cardface.hitc{outline:3px solid var(--danger);outline-offset:3px}
.tkchoice{display:flex;flex-direction:column;gap:9px;margin-bottom:6px}
.tkchoice .btn{justify-content:space-between}
table.score{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 10px}
table.score th{text-align:right;font-weight:800;color:var(--muted);font-size:11.5px;padding:4px 3px}
table.score th:first-child,table.score td:first-child{text-align:left}
table.score td{padding:8px 3px;border-top:2px solid var(--line);text-align:right}
table.score td.tot{font-family:'Fredoka';font-weight:700;font-size:18px}
.who{display:flex;align-items:center;gap:6px;font-weight:800}
.who svg{width:16px;height:22px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.modes .btn{flex-direction:column;align-items:flex-start;gap:2px}
.modes small{font-weight:600;font-size:12.5px;opacity:.75}
/* ===== saboteur layer ===== */
.mate{position:relative}
.mate.out{opacity:.4}
.mate .flag{position:absolute;top:3px;right:6px;font-size:12px;font-weight:800}
.mate .flag.ok{color:var(--good)}
.emergency{width:100%;padding:13px 14px;border-radius:999px;border:2.5px solid var(--outline);background:var(--danger);color:#fff;font-family:'Fredoka';font-weight:700;font-size:18px;margin-bottom:11px;box-shadow:0 4px 0 var(--outline);line-height:1.15}
.emergency small{display:block;font-family:'Nunito';font-weight:700;font-size:12.5px;opacity:.9}
.emergency:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 var(--outline)}
.emergency:disabled{background:var(--card);color:var(--muted);cursor:default;box-shadow:0 2px 0 var(--outline)}
.task{border:2.5px solid var(--accent);border-radius:14px;padding:11px 12px;margin:2px 0 12px}
.task .q{font-weight:800;margin-bottom:9px;font-size:15px}
.opts{display:flex;flex-direction:column;gap:8px}
.votes{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:6px 0 6px}
.vote{border:2.5px solid var(--outline);background:var(--card);border-radius:14px;padding:10px 4px;text-align:center;font-family:'Fredoka';font-weight:600;font-size:16px;box-shadow:0 3px 0 var(--outline)}
.vote svg{width:34px;height:46px;display:block;margin:0 auto 4px}
.vote small{display:block;font-family:'Nunito';font-weight:800;color:var(--good);font-size:11px}
.vote:disabled{opacity:.4;cursor:default}
.blk{stroke:var(--danger);stroke-width:1.6;stroke-dasharray:2 2;fill:none}
.blkdot{fill:var(--danger);stroke:var(--outline);stroke-width:1}
.blktxt{font-family:'Nunito';font-weight:800;font-size:6px;fill:#fff;text-anchor:middle;pointer-events:none}
/* ===== 3D layout ===== */
html,body{height:100%;overflow:hidden}
body{background:#bfe4f6;user-select:none;-webkit-user-select:none}
#world{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.hud{position:fixed;z-index:5}
#hudTop{top:calc(8px + env(safe-area-inset-top,0px));left:8px;right:62px;max-width:560px;margin:0 auto}
#hudTop .roster{margin-bottom:6px;gap:6px}
#hudTop .mate{padding:4px 2px 5px;border-radius:12px}
#hudTop .mate svg{width:18px;height:25px}
#hudTop .mate .nm{font-size:13px}
#hudTop .mate .meta{font-size:10.5px}
#hudTop .status{font-size:13px;min-height:38px;padding:7px 11px;margin:0}
#hudRight{top:calc(8px + env(safe-area-inset-top,0px));right:8px;display:flex;flex-direction:column;gap:8px}
#hudRight .iconbtn{font-size:15px}
#hudRight .iconbtn[aria-pressed="false"]{opacity:.5}
#hudRight #ffBtn[aria-pressed="true"]{background:var(--accent);opacity:1}
#hudLeft{top:calc(156px + env(safe-area-inset-top,0px));left:8px;width:172px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
#hudLeft>*{pointer-events:auto}
.mini{padding:8px 9px 7px;margin:0}
.mini .mh{font-family:'Fredoka';font-weight:600;font-size:14px;margin-bottom:3px;display:flex;justify-content:space-between;align-items:baseline}
.mini .mh small{font-family:'Nunito';font-weight:700;font-size:10.5px;color:var(--muted)}
#hudLeft{width:196px}
.mapmini{padding:5px}
#minimap{width:100%;display:block;border-radius:10px;cursor:pointer;touch-action:none}
.ticket[data-walkt]{cursor:pointer}
.mkrow{display:flex;align-items:center;gap:7px;width:100%;background:none;border:0;padding:3px 3px;font-weight:800;font-size:13px;text-align:left;border-radius:8px}
.mkrow:hover{background:var(--card)}
.mkrow .d{margin-left:auto;color:var(--muted);font-size:11px;font-weight:700}
#feed{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:5px;pointer-events:none}
#feed li{background:var(--panel);border:2px solid var(--outline);border-radius:10px;padding:5px 8px;font-size:12px;line-height:1.3;box-shadow:0 2px 0 var(--outline);animation:fadeout 7s forwards}
#feed li.good{border-color:var(--good)}
#feed li.danger{border-color:var(--danger)}
@keyframes fadeout{0%,82%{opacity:1}100%{opacity:0}}
#hudBottom{left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:flex-end;justify-content:space-between;pointer-events:none}
#hudBottom>*{pointer-events:auto}
.handp{margin:0;max-width:430px;flex:0 1 430px;padding:9px 10px 10px}
.handp .ph{margin-bottom:4px}
.handp .cardface{width:38px;height:50px;border-radius:8px}
.handp .cardface svg{width:24px;height:16px}
.handp .cardface .cl{font-size:9px;line-height:13px}
.handp .handrow{gap:10px}
.actcol{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.actcol .row{display:flex;gap:8px}
.actcol .btn{padding:9px 12px;font-size:13.5px}
#chips{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
#chips .btn{padding:7px 11px;font-size:12.5px;background:var(--panel)}
.use{width:98px;height:98px;border-radius:50%;border:3px solid var(--outline);background:var(--accent);color:var(--accentInk);box-shadow:0 5px 0 var(--outline);font-family:'Fredoka';font-weight:700;font-size:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:8px;line-height:1}
.use small{font-family:'Nunito';font-weight:800;font-size:10.5px;line-height:1.15;max-width:82px;text-align:center}
.use:disabled{opacity:.45;cursor:default}
.use.go{animation:pulse 1.3s ease-in-out infinite}
.use:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--outline)}
@keyframes pulse{50%{transform:scale(1.06)}}
#postcard{bottom:calc(150px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:min(430px,calc(100% - 24px));background:var(--panel);border:2.5px solid var(--outline);border-radius:16px;padding:10px 12px;box-shadow:0 4px 0 var(--outline);pointer-events:none}
#postcard .pt{display:flex;gap:10px;align-items:center}
#postcard p{font-size:13px;margin-top:5px;line-height:1.35}
#postcard h3{font-size:18px;line-height:1.1}
#postcard .pcE{width:44px;height:44px;font-size:26px}
#tixPanel{right:8px;bottom:calc(214px + env(safe-area-inset-bottom,0px));width:min(320px,calc(100% - 16px));margin:0;max-height:42vh;overflow:auto}
.userow{align-items:flex-end}
.use.meet{width:74px;height:74px;background:var(--danger);color:#fff;font-size:30px}
.use.meet small{font-size:10px}
.use.meet:not(:disabled){animation:pulse 1.6s ease-in-out infinite}
.mate{position:relative}.mate.out{opacity:.4}
.mate .flag{position:absolute;top:2px;right:5px;font-size:11px;font-weight:800}.mate .flag.ok{color:var(--good)}
#alarm{inset:0;pointer-events:none;opacity:0;box-shadow:inset 0 0 180px 40px rgba(255,40,60,.85);transition:opacity .2s}
#alarm.on{opacity:1;animation:alarm .6s ease-in-out infinite alternate}
@keyframes alarm{from{box-shadow:inset 0 0 120px 20px rgba(255,40,60,.6)}to{box-shadow:inset 0 0 220px 60px rgba(255,40,60,.95)}}
.task{border:2.5px solid var(--accent);border-radius:14px;padding:11px 12px;margin:2px 0 12px}
.task .q{font-weight:800;margin-bottom:9px;font-size:15px}
.opts{display:flex;flex-direction:column;gap:8px}
.votes{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:6px 0 6px}
.vote{border:2.5px solid var(--outline);background:var(--card);border-radius:14px;padding:10px 4px;text-align:center;font-family:'Fredoka';font-weight:600;font-size:16px;box-shadow:0 3px 0 var(--outline)}
.vote svg{width:34px;height:46px;display:block;margin:0 auto 4px}
.vote small{display:block;font-family:'Nunito';font-weight:800;color:var(--good);font-size:11px}
.vote:disabled{opacity:.55;cursor:default}
.chat{display:flex;flex-direction:column;gap:7px;margin:8px 0 12px;max-height:34vh;overflow:auto}
.say{display:flex;gap:9px;align-items:flex-start;background:var(--card);border-radius:12px;padding:8px 10px;animation:up .2s ease-out}
.say>svg{width:22px;height:30px;flex:none}
.say b{font-family:'Fredoka';font-weight:600;font-size:14px}
.sheet .say p{margin:0;font-size:14.5px}
.note.ev{font-size:13px;border-left:4px solid var(--danger)}
.chips{display:flex;gap:2px;justify-content:center;min-height:22px;margin-top:4px;flex-wrap:wrap}
.vote .chips svg,.btn .chips svg{width:14px;height:19px;margin:0;display:inline-block}
.btn .chips{display:inline-flex;vertical-align:middle;margin:0 0 0 6px}
.vote.mine,.btn.mine{outline:3px solid var(--accent);outline-offset:2px}
.note.verdict{font-size:16px;font-weight:800}
#logList{list-style:none;padding:0;display:flex;flex-direction:column;gap:7px;font-size:14px}
#logList li{padding-left:10px;border-left:3px solid var(--line)}#logList li.danger{border-color:var(--danger)}#logList li.good{border-color:var(--good)}

const SHORT=[['PAR','WIE'],['AMS','ROM'],['MAD','ZUR'],['LON','BER'],['BER','ROM'],['CPH','BUD'],['FRA','SOF'],['ZUR','BUD'],['VEN','IST'],['RIG','BUC'],['STO','BER'],['MUN','ATH'],['BCN','MUN'],['KYI','SOF'],['WAR','ATH'],['LON','ZUR'],['EDI','PAR'],['PAR','ROM'],['AMS','WIE'],['BER','KYI'],['LIS','MRS'],['MAD','AMS'],['ZAG','MOS'],['BRI','BUD'],['CPH','WAR'],['MRS','VEN'],['FRA','RIG'],['ROM','SOF']].map(([a,b])=>({a,b,p:tval(a,b,0)}));

function edgesConnected(edges,a,b){
  const adj={};edges.forEach(r=>{(adj[r.a]=adj[r.a]||[]).push(r.b);(adj[r.b]=adj[r.b]||[]).push(r.a)});
  const seen=new Set([a]),q=[a];
  while(q.length){const x=q.shift();if(x===b)return true;(adj[x]||[]).forEach(y=>{if(!seen.has(y)){seen.add(y);q.push(y)}})}
  return false;
}

function sprocketInner(col){return `<line x1="0" y1="-8" x2="1.5" y2="-13" stroke="#1c1d33" stroke-width="1.8"/><circle cx="1.8" cy="-13.8" r="2.2" fill="${col}" stroke="#1c1d33" stroke-width="1.4"/><rect x="-6" y="6.5" width="4" height="4.4" rx="1" fill="#1c1d33"/><rect x="2" y="6.5" width="4" height="4.4" rx="1" fill="#1c1d33"/><polygon points="9,0 4.5,7.8 -4.5,7.8 -9,0 -4.5,-7.8 4.5,-7.8" fill="${col}" stroke="#1c1d33" stroke-width="1.9" stroke-linejoin="round"/><circle cx="0" cy="-0.5" r="4.3" fill="#fff" stroke="#1c1d33" stroke-width="1.4"/><circle cx="1.3" cy="-0.5" r="2" fill="#1c1d33"/>`}
const sprocket=col=>`<svg viewBox="-11 -17 22 29" aria-hidden="true">${sprocketInner(col)}</svg>`;
const sw=c=>`<span class="sw ${c==='loco'?'swloco':''}" style="${c==='loco'?'':'background:'+HEX[c]}"></span>`;
function payLabel(o){const p=[];if(o.n)p.push(`${sw(o.c)}${o.n} ${o.c}`);if(o.w)p.push(`${sw('loco')}${o.w} loco${o.w>1?'s':''}`);return p.join('<span class="plus">+</span>')}


/* ===== state ===== */
const PLAYERS=[
  {id:0,name:'You',col:'#14b8a6',human:true},{id:1,name:'Rose',col:'#ff4fa3'},
  {id:2,name:'Sandy',col:'#c8894a'},{id:3,name:'Mint',col:'#9be15d'}
];
let S=null;const H=()=>S.players[0];
let GEN=0,FAST=false;
const sleep=ms=>FAST?Promise.resolve():new Promise(r=>setTimeout(r,ms));

function newGame(trains,silent){
  GEN++;
  const deck=[];COLS.forEach(c=>{for(let i=0;i<12;i++)deck.push(c)});for(let i=0;i<14;i++)deck.push('loco');
  shuffle(deck);
  const longs=shuffle(LONG.map(t=>({...t}))),shorts=shuffle(SHORT.map(t=>({...t})));
  S={deck,discard:[],market:[],marketCity:[],ticketDeck:[],turn:0,round:1,drawn:0,busy:false,over:false,locked:!!silent,lastTurns:null,
     selected:null,stationAt:{},log:[],startTrains:trains,
     routes:ROUTES.map(r=>({...r,owner:null,blocked:0})),
     players:PLAYERS.map(p=>({...p,hand:{},trains,stations:3,tickets:[],alive:true,cleared:false,pos:null}))};
  S.sab=1+rand(3);S.sabotages=0;S.sabRound=0;S.caught=false;S.meetingUsed=false;S.meetingPts=0;S.taskUsed=false;S.tasksDone={};
  resetActors();
  S.players.forEach(p=>{for(let k=0;k<4;k++)give(p,draw())});
  for(let k=0;k<5;k++)setSlot(k,draw());fixMarket(true);
  const offers=S.players.map(()=>[longs.pop(),shorts.pop(),shorts.pop(),shorts.pop()]);
  S.ticketDeck=shorts;
  for(let i=1;i<4;i++){
    const o=offers[i].map(t=>({t,c:dijkstra(ROUTES,t.a,t.b,r=>r.len).cost})).sort((x,y)=>x.c-y.c);
    S.players[i].tickets=[o[0].t,o[1].t];o.slice(2).forEach(x=>{if(!x.t.long)S.ticketDeck.push(x.t)});
  }
  $('feed').innerHTML='';
  addLog(`New game with ${trains} trains each. One of the other robots is a saboteur. Choose your destination tickets.`);
  render();
  if(!silent)offerTickets(offers[0],2,true);
}
function draw(){if(!S.deck.length){S.deck=shuffle(S.discard);S.discard=[]}return S.deck.pop()||null}
function give(p,c){if(c)p.hand[c]=(p.hand[c]||0)+1}
function addLog(t,k=''){
  S.log.unshift({t,k});S.log=S.log.slice(0,40);
  if(FAST)return;
  const f=$('feed'),li=document.createElement('li');li.className=k;li.textContent=t;f.prepend(li);
  while(f.children.length>4)f.lastChild.remove();
  setTimeout(()=>li.remove(),7000);
}
/* face-up cards float above cities: each market slot has a card and a city */
function setSlot(i,c){S.market[i]=c;S.marketCity[i]=c?pickCity(i):null}
function pickCity(i){
  const used=new Set(S.marketCity.filter((c,j)=>j!==i&&c));
  let cands=IDS.filter(id=>!used.has(id));
  const far=cands.filter(id=>ACT.every(A=>Math.hypot(A.x-WX(id),A.z-WZ(id))>10));
  if(far.length)cands=far;
  return pick(cands);
}
function fixMarket(quiet){
  for(let i=0;i<5;i++)if(!S.market[i])setSlot(i,draw());
  let t=0;
  while(S.market.filter(c=>c==='loco').length>=3&&t<3){
    S.discard.push(...S.market.filter(Boolean));for(let i=0;i<5;i++)setSlot(i,draw());t++;
    if(!quiet)addLog('Three locomotives were floating at once, so all the cards were redealt.');
  }
}
const nbrs=id=>ADJ[id].map(ri=>{const r=ROUTES[ri];return r.a===id?r.b:r.a});
const reachable=id=>S.routes.some(r=>r.owner===0&&(r.a===id||r.b===id))||S.stationAt[id]===0;
const canAct=()=>S&&!S.busy&&!S.over&&!S.locked&&S.turn===0;
const routePts=pid=>S.routes.filter(r=>r.owner===pid).reduce((s,r)=>s+PTS[r.len],0);

/* ===== payment ===== */
function payOptions(p,r){
  if(r.blocked||p.trains<r.len)return[];
  const L=p.hand.loco||0,opts=[];
  for(const c of(r.color==='gray'?COLS:[r.color])){
    const have=p.hand[c]||0,n=Math.min(have,r.len-r.ferry),w=r.len-n;
    if(n>0&&L>=w)opts.push({c,n,w});
  }
  if(L>=r.len)opts.push({c:'loco',n:0,w:r.len});
  return opts.sort((a,b)=>a.w-b.w||b.n-a.n);
}
function payPlan(p,o){
  if(o.n){p.hand[o.c]-=o.n;for(let i=0;i<o.n;i++)S.discard.push(o.c)}
  if(o.w){p.hand.loco-=o.w;for(let i=0;i<o.w;i++)S.discard.push('loco')}
}
const tunnelExtra=(o,rev)=>rev.filter(x=>x==='loco'||(o.c!=='loco'&&x===o.c)).length;
function extraPlan(p,o,extra){
  if(!extra)return{c:o.c,n:0,w:0};
  const hc=o.c==='loco'?0:(p.hand[o.c]||0)-o.n,hl=(p.hand.loco||0)-o.w;
  if(hc+hl<extra)return null;const n=Math.min(hc,extra);return{c:o.c,n,w:extra-n};
}
function claim(p,r){
  r.owner=p.id;p.trains-=r.len;p.pos=p.pos===r.a?r.b:p.pos===r.b?r.a:r.b;
  addLog(`${p.human?'You':p.name} claimed ${nm(r.a)} to ${nm(r.b)} for ${PTS[r.len]} pts.`,p.human?'good':'');
}
function stationOptions(p,k){
  const L=p.hand.loco||0,o=[];
  COLS.forEach(c=>{const h=p.hand[c]||0;if(h>0&&h+L>=k){const n=Math.min(h,k);o.push({c,n,w:k-n})}});
  if(L>=k)o.push({c:'loco',n:0,w:k});
  return o.sort((a,b)=>a.w-b.w);
}


/* ===== turn flow (bots walk to where they act) ===== */
async function endTurn(){
  if(S.over)return;
  const g=GEN,p=S.players[S.turn];
  if(S.lastTurns===null&&(p.trains<=2||S.routes.every(r=>r.owner!==null))){S.lastTurns=S.players.filter(q=>q.alive).length+1;SND.ready&&SND.fx.finalRound();addLog(p.trains<=2?`${p.human?'You have':p.name+' has'} ${p.trains} trains left. Everyone gets one final turn.`:'Every route is taken. Everyone gets one final turn.','danger')}
  if(S.lastTurns!==null){S.lastTurns--;if(S.lastTurns<=0){endGame();return}}
  do{S.turn=(S.turn+1)%S.players.length;
    if(S.turn===0){S.round++;S.taskUsed=false;S.routes.forEach(r=>{if(r.blocked>0)r.blocked--})}
  }while(!S.players[S.turn].alive);
  S.drawn=0;S.selected=null;
  if(S.round>60){endGame();return}
  const q=S.players[S.turn];
  if(q.human){S.busy=false;render();SND.ready&&SND.fx.yourTurn();return}
  S.busy=true;render();
  await sleep(FF?60:200);
  if(g!==GEN||S.over)return;
  await botTurn(q);
  if(g!==GEN||S.over)return;
  render();
  return endTurn();
}

/* ===== human actions ===== */
function takeMarket(i){
  if(!canAct())return;const c=S.market[i];if(!c)return;
  if(c==='loco'&&S.drawn===1){addLog('A floating locomotive can’t be your second card.','danger');return}
  const city=S.marketCity[i];
  give(H(),c);fx.pickup(city,c);setSlot(i,draw());fixMarket();
  addLog(`You took ${c==='loco'?'a floating locomotive':'a '+c+' card'} in ${nm(city)}.`);
  if(c==='loco'){endTurn();return}
  S.drawn++;afterDraw();
}
function takeDeck(){
  if(!canAct())return;const c=draw();if(!c)return;give(H(),c);
  addLog(`You drew ${c==='loco'?'a locomotive':'a '+c+' card'} from the deck.`);
  S.drawn++;afterDraw();
}
function afterDraw(){
  if(S.drawn>=2)return endTurn();
  if(!(S.deck.length+S.discard.length)&&!S.market.some(c=>c&&c!=='loco')){addLog('No cards left to draw.');return endTurn()}
  render();
}
function startClaim(ri,o){
  const r=S.routes[ri],p=H();
  if(!r.tunnel){payPlan(p,o);claim(p,r);closeSheet(true);endTurn();return}
  const rev=[draw(),draw(),draw()].filter(Boolean);S.discard.push(...rev);
  const extra=tunnelExtra(o,rev),ex=extraPlan(p,o,extra);
  S.pending={ri,o,extra,ex};S.locked=true;
  const cards=rev.map(c=>cardHTML(c,'',(c==='loco'||(o.c!=='loco'&&c===o.c))?'hitc':'')).join('');
  let body;
  if(!extra)body=`<p>None of the flipped cards match. The tunnel is clear.</p><button class="btn primary full" data-tunnel="go">Build the route</button>`;
  else if(ex)body=`<p>${extra} card${extra>1?'s':''} matched, so this tunnel costs ${extra} more.</p><button class="btn primary full" data-tunnel="go">Pay ${payLabel(ex)}</button><button class="btn full" data-tunnel="back">Back off and keep your cards</button>`;
  else body=`<p>${extra} card${extra>1?'s':''} matched, and you can’t cover the extra cost. Your cards go back in your hand and your turn ends.</p><button class="btn full" data-tunnel="back">Back off</button>`;
  sheet(`<div class="kicker">Tunnel: ${nm(r.a)} to ${nm(r.b)}</div><h3>Flipping 3 cards</h3><div class="reveal">${cards}</div>${body}`);
}
function tunnelResolve(go){
  const{ri,o,extra,ex}=S.pending,p=H(),r=S.routes[ri];
  if(go&&(ex||!extra)){payPlan(p,o);if(extra)payPlan(p,ex);claim(p,r)}
  else addLog(`You backed off the ${nm(r.a)} to ${nm(r.b)} tunnel.`);
  S.pending=null;S.locked=false;closeSheet(true);endTurn();
}
function buildStation(j){
  const o=S.cityOpts[j],p=H(),id=S.curCity;if(!o||!canAct())return;
  payPlan(p,o);S.stationAt[id]=0;p.stations--;p.pos=id;
  addLog(`You built a station in ${nm(id)}.`,'good');closeSheet(true);endTurn();
}
function offerTickets(list,min,initial){
  S.offer={list,min,initial,keep:new Set()};S.locked=true;renderTicketChoice();
}
function renderTicketChoice(){
  const{list,min,keep,initial}=S.offer;
  sheet(`<div class="kicker">${initial?'Starting tickets':'New tickets'}</div><h3>Keep at least ${min}</h3>
  <p>Connect both cities on a ticket by the end of the game to score it. Unfinished tickets count against you.</p>
  <div class="tkchoice">${list.map((t,i)=>`<button class="btn ${keep.has(i)?'sel':''}" data-tk="${i}" aria-pressed="${keep.has(i)}"><span>${keep.has(i)?'✓ ':''}${nm(t.a)} to ${nm(t.b)}${t.long?'<span class="tag">Long</span>':''}</span><span class="fd">${t.p}</span></button>`).join('')}</div>
  <button class="btn primary full" data-keep ${keep.size<min?'disabled':''}>Keep ${keep.size||''} ticket${keep.size===1?'':'s'}</button>`);
}
function confirmTickets(){
  const{list,min,keep,initial}=S.offer;if(keep.size<min)return;
  if(initial)H().pos=list[[...keep][0]].a;
  list.forEach((t,i)=>{if(keep.has(i))H().tickets.push(t);else if(!t.long)S.ticketDeck.push(t)});
  addLog(`You kept ${keep.size} ticket${keep.size>1?'s':''}.`);
  S.offer=null;S.locked=false;closeSheet(true);
  if(initial){S.busy=false;render()}else endTurn();
}
function drawTicketsHuman(){
  if(!canAct()||S.drawn||!S.ticketDeck.length)return;
  offerTickets(S.ticketDeck.splice(0,3),1,false);
}


/* ===== bots ===== */
function wanted(p){
  const want=new Map(),own=S.routes.filter(r=>r.owner===p.id);
  p.tickets.forEach(t=>{
    if(edgesConnected(own,t.a,t.b))return;
    const path=dijkstra(S.routes,t.a,t.b,r=>r.owner===p.id?0:(r.owner===null&&!r.blocked)?r.len+(r.tunnel?.6:0)+r.ferry*.6:Infinity);
    if(!path)return;
    path.edges.forEach(ri=>{if(S.routes[ri].owner===null)want.set(ri,(want.get(ri)||0)+t.p)});
  });
  return want;
}

/* ---- talking robots: each robot suspects the others from what it saw and heard, accuses, lies (the saboteur) and votes ---- */
const aliveBots=()=>S.players.filter(p=>!p.human&&p.alive);
const susOf=(b,q)=>(S.sus&&S.sus[b]&&S.sus[b][q])||0;
function addSus(b,q,v){if(b===q||!S.players[q].alive||(S.players[q].cleared&&v>0))return;S.sus=S.sus||{};const m=S.sus[b]=S.sus[b]||{};m[q]=Math.max(0,(m[q]||0)+v)}
function recordSabotage(p,r,wit,line){
  const sight={};aliveBots().forEach(q=>{sight[q.id]=nearestCity(ACT[q.id].x,ACT[q.id].z).id});
  S.lastSab={a:r.a,b:r.b,wit,sight,line,held:false,round:S.round};
  const near=c=>c===r.a||c===r.b?22:(nbrs(r.a).includes(c)||nbrs(r.b).includes(c))?8:-8;
  aliveBots().forEach(b=>{if(b.id===S.sab)return;
    if(wit.includes(b.id))addSus(b.id,p.id,100); // saw it happen
    aliveBots().forEach(q=>{if(q.id!==b.id)addSus(b.id,q.id,near(sight[q.id]))})});
}
function botWantsMeeting(p){
  const ls=S.lastSab;if(!ls||ls.held||S.caught||(S.botMeetings||0)>=2||S.over)return false;
  if(p.id===S.sab)return ls.round===S.round&&Math.random()<.25; // a bold saboteur reports its own sabotage to frame someone
  return Math.max(0,...aliveBots().filter(q=>q.id!==p.id).map(q=>susOf(p.id,q.id)))>=60;
}
function humanMeeting(){if(!meetingOpen())return;S.meetingUsed=true;runMeeting(0)}
function discussion(caller){
  const ls=S.lastSab,L=[],bots=aliveBots(),route=ls?`${nm(ls.a)}–${nm(ls.b)}`:'that line',sabAlive=!S.caught&&S.players[S.sab].alive;
  const where=id=>ls&&ls.sight[id]?ls.sight[id]:nearestCity(ACT[id].x,ACT[id].z).id;
  const claims={};
  const said=(pid,text,o={})=>{L.push({pid,text});if(o.acc==null)return;claims[pid]=o.acc;
    bots.forEach(b=>{if(b.id===S.sab||b.id===pid)return;addSus(b.id,o.acc,o.callout?48:30*(1-Math.min(1,susOf(b.id,pid)/100)))})};
  const accusedNow=id=>Object.values(claims).includes(id);
  const pub=q=>bots.reduce((s,b)=>s+susOf(b.id,q),0);
  const goat=bots.filter(b=>b.id!==S.sab&&!b.cleared).sort((x,y)=>pub(y.id)-pub(x.id))[0];
  let lie=null;
  if(caller===0)L.push({pid:0,text:'I called this meeting. Who was near the signals?'});
  const order=[caller,...bots.map(b=>b.id).filter(id=>id!==caller)].filter(id=>id!==0&&S.players[id].alive);
  order.forEach(id=>{
    if(sabAlive&&id===S.sab){
      if(accusedNow(id)){const fake=pick(IDS.filter(c=>c!==where(id)&&(!ls||(c!==ls.a&&c!==ls.b&&!nbrs(ls.a).includes(c)&&!nbrs(ls.b).includes(c)))));lie=fake;
        said(id,`Me? I was in ${nm(fake)} the whole time!`);
        if(goat)said(id,`${goat.name} was right by the ${route} signals. Look at the log.`,{acc:goat.id})}
      else if(goat&&Math.random()<.6)said(id,`I saw ${goat.name} near the ${route} signals!`,{acc:goat.id});
      else if(goat)said(id,`${goat.name} was in ${nm(where(goat.id))}. That’s awfully close to the fault.`,{acc:goat.id});
      else said(id,'I didn’t see anything. Let’s not throw anyone off on a hunch.');
      return;
    }
    const defended=accusedNow(id);if(defended)said(id,`It wasn’t me! The log has me in ${nm(where(id))}.`);
    if(lie&&sabAlive&&Math.random()<.6){said(id,`Hang on. The log puts ${S.players[S.sab].name} in ${nm(where(S.sab))}, not ${nm(lie)}.`,{acc:S.sab,callout:true});lie=null;return}
    if(ls&&ls.wit.includes(id)&&sabAlive){said(id,`I saw ${S.players[S.sab].name} at the ${route} signals!`,{acc:S.sab});return}
    const top=bots.filter(q=>q.id!==id&&!q.cleared).sort((x,y)=>susOf(id,y.id)-susOf(id,x.id))[0];
    if(top&&susOf(id,top.id)>=30&&!accusedNow(top.id)||top&&susOf(id,top.id)>=60)said(id,`${top.name} was in ${nm(where(top.id))}, right next to the fault.`,{acc:top.id});
    else if(!defended){const cl=bots.find(q=>q.cleared&&q.id!==id);said(id,cl?`${cl.name}’s alibi already checked out. I was in ${nm(where(id))} and didn’t see it.`:`I was in ${nm(where(id))}. I didn’t see a thing.`)}
  });
  return L;
}
function botVotes(){
  const v={},bots=aliveBots(),pub=q=>bots.reduce((s,c)=>s+susOf(c.id,q),0);
  bots.forEach(b=>{
    const pool=bots.filter(q=>q.id!==b.id&&!q.cleared);
    if(!S.caught&&b.id===S.sab){const goat=pool.sort((x,y)=>pub(y.id)-pub(x.id))[0];v[b.id]=goat?goat.id:'skip';return}
    const top=pool.sort((x,y)=>susOf(b.id,y.id)-susOf(b.id,x.id))[0];v[b.id]=top&&susOf(b.id,top.id)>=56?top.id:'skip';
  });
  return v;
}
function tally(v){const n={};Object.values(v).forEach(x=>{n[x]=(n[x]||0)+1});const r=Object.entries(n).filter(([k])=>k!=='skip').sort((a,b)=>b[1]-a[1]);
  if(!r.length||r[0][1]<2||(r[1]&&r[1][1]===r[0][1])||(n.skip||0)>=r[0][1])return null;return +r[0][0]}
function applyResult(ej,v){

async function botSabotage(p){

  if(!cand.length){const near=nbrs(c0).filter(c=>open(c).length);if(!near.length)return;c0=pick(near);cand=open(c0)}
  const hw=wanted(H()),hit=cand.filter(r=>hw.has(r.i)),r=pick(hit.length?hit:cand); // prefers routes you need
  const[mx,mz]=routeMid(r);
  await walkTo(p.id,mx,mz);if(g!==GEN||S.over)return;
  r.blocked=3;S.sabotages++;fx.sparks(mx,mz);fx.alarm();SND.ready&&SND.fx.sabotage();render();
  const seen=Math.hypot(ACT[0].x-mx,ACT[0].z-mz)<32;
  const wit=S.players.filter(q=>!q.human&&q.alive&&q.id!==p.id&&Math.hypot(ACT[q.id].x-mx,ACT[q.id].z-mz)<21).map(q=>q.id);
  const hub=pick([r.a,r.b]),hop1=pick([hub,...nbrs(hub)]),dest=Math.random()<.5?pick([hop1,...nbrs(hop1)]):hop1;await walkTo(p.id,...W(dest));if(g!==GEN||S.over)return;

  if(seen)addLog(`👀 You saw ${p.name} at the ${nm(r.a)}–${nm(r.b)} signals!`,'danger');
  recordSabotage(p,r,wit,`⚠ Sabotage! Signal fault on ${nm(r.a)} to ${nm(r.b)}, blocked for 2 rounds. Sightings: ${sight}.`);

async function botTurn(p){
  if(p.id===S.sab&&!S.caught&&p.alive&&S.round%3===0&&S.sabRound!==S.round){S.sabRound=S.round;const g=GEN;await botSabotage(p);if(g!==GEN||S.over)return}
  {const g=GEN;if(botWantsMeeting(p)){await runMeeting(p.id);if(g!==GEN||S.over||!p.alive)return}}
  const want=wanted(p);let best=null;
  for(const[ri,pr]of want){
    const r=S.routes[ri],o=payOptions(p,r)[0];if(!o)continue;
    const sc=r.len*2+pr*.3-o.w*1.5;if(!best||sc>best.sc)best={r,o,sc};
  }
  if(best)return botClaim(p,best.r,best.o);
  const hc=Object.values(p.hand).reduce((a,b)=>a+b,0);
  if(hc>=9){
    const mine=new Set();S.routes.forEach(r=>{if(r.owner===p.id){mine.add(r.a);mine.add(r.b)}});
    let alt=null;
    S.routes.forEach(r=>{if(r.owner!==null)return;const o=payOptions(p,r)[0];if(!o||p.trains-r.len<0)return;
      const sc=r.len+((mine.has(r.a)||mine.has(r.b))?2:0)-o.w*1.5;if(!alt||sc>alt.sc)alt={r,o,sc}});

    let any=null;
    S.routes.forEach(r=>{if(r.owner!==null)return;const o=payOptions(p,r)[0];if(o&&(!any||r.len>any.r.len))any={r,o}});

async function botClaim(p,r,o){
  const g=GEN;

function botTickets(p){

async function botDraw(p,want){
  const g=GEN,need={};let mostC=null,mostN=-1;
  COLS.forEach(c=>{if((p.hand[c]||0)>mostN){mostN=p.hand[c]||0;mostC=c}});

  for(let k=0;k<2;k++){

/* ===== scoring ===== */
function ticketScore(p){
  const own=S.routes.filter(r=>r.owner===p.id);
  const st=IDS.filter(c=>S.stationAt[c]===p.id);
  const ch=st.map(c=>[null,...ADJ[c].map(i=>S.routes[i]).filter(r=>r.owner!==null&&r.owner!==p.id)]);
  let best=null;
  (function rec(k,extra){
    if(k===ch.length){let s=0;const det=p.tickets.map(t=>{const ok=edgesConnected(own.concat(extra),t.a,t.b);s+=ok?t.p:-t.p;return ok});if(!best||s>best.s)best={s,det};return}
    for(const r of ch[k])rec(k+1,r?extra.concat([r]):extra);
  })(0,[]);
  return best;
}
function longest(pid){
  const es=S.routes.filter(r=>r.owner===pid),adj={};let best=0;
  es.forEach((e,i)=>{(adj[e.a]=adj[e.a]||[]).push(i);(adj[e.b]=adj[e.b]||[]).push(i)});
  const used=es.map(()=>false);
  const dfs=(c,l)=>{if(l>best)best=l;for(const i of adj[c]||[]){if(used[i])continue;used[i]=true;dfs(es[i].a===c?es[i].b:es[i].a,l+es[i].len);used[i]=false}};
  Object.keys(adj).forEach(c=>dfs(c,0));return best;
}

  addLog(`Game over. ${w.human?'You win':w.name+' wins'} with ${rows[0].total} pts.`,'good');render();

  <p>Longest continuous route: ${maxL} trains, held by ${ex.join(' and ')} for +10.</p>

function stepActor(A,dt,t){

  let vx=0,vz=0;
  if(A.id===0&&!sheetOpen()){
    vx=(KEYS.has('d')||KEYS.has('arrowright')?1:0)-(KEYS.has('a')||KEYS.has('arrowleft')?1:0);
    vz=(KEYS.has('s')||KEYS.has('arrowdown')?1:0)-(KEYS.has('w')||KEYS.has('arrowup')?1:0);

  }

function animRobot(R,A,t){

}

/* ---- what can you use right here? ---- */

    out.push({key:'m'+i+c,label:`Take ${c==='loco'?'locomotive':c+' card'}`,ok:canAct()&&!(c==='loco'&&S.drawn===1),go:()=>takeMarket(i)})});
  const nc=nearestCity(A.x,A.z);
  if(nc.d<5.5){const p=H(),can=canAct()&&!S.drawn&&p.stations>0&&S.stationAt[nc.id]===undefined;
    const task=!S.over&&!S.locked&&reachable(nc.id)&&!S.tasksDone[nc.id]&&!S.taskUsed;
    out.push({key:'c'+nc.id+task,label:task?`Task · ${C[nc.id].n}`:can?`Station · ${C[nc.id].n}`:`${C[nc.id].n} postcard`,ok:true,go:()=>openCity(nc.id),city:nc.id})}
  else{let best=null,bd=3.3;SEGS.forEach((s,i)=>{const[d,t]=segDist(A.x,A.z,s);if(d<bd&&t>.08&&t<.92){bd=d;best=i}});
    if(best!==null){const r=S.routes[best];out.push({key:'r'+best,label:r.owner===null?`Claim ${nm(r.a)}–${nm(r.b)}`:`${nm(r.a)}–${nm(r.b)}`,ok:true,go:()=>openRoute(best),route:best})}}

}

/* ---- minimap: the whole continent at a glance; tap to walk there ---- */
const MM=$('minimap'),mm=MM.getContext('2d'),MK=2;let mmBase=null,mmT=0;
function mmBuild(){
  mmBase=document.createElement('canvas');mmBase.width=MM.width;mmBase.height=MM.height;const x=mmBase.getContext('2d');x.scale(MK,MK);
  x.fillStyle='#6fc3ea';x.fillRect(0,0,392,300);x.fillStyle='#f3df9f';x.strokeStyle='#1c1d33';x.lineWidth=.8;x.lineJoin='round';
  const poly=P=>{x.beginPath();P.forEach(([wx,wz],i)=>i?x.lineTo(wx+196,wz+150):x.moveTo(wx+196,wz+150));x.closePath()};
  LANDPOLY.forEach(P=>{poly(P);x.fill();x.stroke()});x.fillStyle='#6fc3ea';poly(SEAPOLY);x.fill();x.stroke();
}
function drawMinimap(){
  if(!S)return;if(!mmBase)mmBuild();
  mm.setTransform(1,0,0,1,0,0);mm.drawImage(mmBase,0,0);mm.setTransform(MK,0,0,MK,0,0);
  const P=(id)=>[C[id].x,C[id].y];
  S.routes.forEach(r=>{const[a1,a2]=P(r.a),[b1,b2]=P(r.b);mm.beginPath();mm.moveTo(a1,a2);mm.lineTo(b1,b2);
    if(r.blocked){mm.setLineDash([3,2]);mm.strokeStyle='#ff3b4f';mm.lineWidth=3}else if(r.owner!==null){mm.setLineDash([]);mm.strokeStyle=PLAYERS[r.owner].col;mm.lineWidth=3.2}
    else{mm.setLineDash([]);mm.strokeStyle=HEX[r.color];mm.globalAlpha=.55;mm.lineWidth=1.6}
    mm.stroke();mm.globalAlpha=1;mm.setLineDash([])});
  const own0=new Set();S.routes.forEach(r=>{if(r.owner===0){own0.add(r.a);own0.add(r.b)}});
  IDS.forEach(id=>{const[x,y]=P(id);mm.beginPath();mm.arc(x,y,2.6,0,7);mm.fillStyle=own0.has(id)?'#ffc933':'#fff';mm.fill();mm.lineWidth=.8;mm.strokeStyle='#1c1d33';mm.stroke()});
  // your unfinished ticket cities
  const det=H().tickets.length?ticketScore(H()).det:[];H().tickets.forEach((t,i)=>{if(det[i])return;[t.a,t.b].forEach(id=>{const[x,y]=P(id);mm.beginPath();mm.arc(x,y,6+Math.sin(clockMM()*4)*1,0,7);mm.strokeStyle='#e8a400';mm.lineWidth=1.8;mm.stroke()})});
  // floating cards
  S.market.forEach((c,i)=>{if(!c)return;const[x,y]=P(S.marketCity[i]);mm.save();mm.translate(x,y-7);mm.rotate(Math.PI/4);mm.fillStyle=c==='loco'?'#ffc933':HEX[c];mm.fillRect(-2.6,-2.6,5.2,5.2);mm.lineWidth=.8;mm.strokeStyle='#1c1d33';mm.strokeRect(-2.6,-2.6,5.2,5.2);mm.restore()});
  // what the camera sees
  const hw=Math.max(18,CAM.cur*.42*Math.min(1.6,camera.aspect)),hh=Math.max(14,CAM.cur*.5);
  mm.strokeStyle='rgba(28,29,51,.55)';mm.lineWidth=1;mm.strokeRect(CAM.x+196-hw,CAM.z+150-hh*.75,hw*2,hh*1.4);
  // robots
  ACT.forEach((A,i)=>{if(S.players[i].alive===false)return;const x=A.x+196,y=A.z+150,me=i===0;mm.beginPath();mm.arc(x,y,me?5:3.8,0,7);mm.fillStyle=PLAYERS[i].col;mm.fill();mm.lineWidth=me?1.6:1;mm.strokeStyle=me?'#fff':'#1c1d33';mm.stroke();if(me){mm.beginPath();mm.arc(x,y,6.6,0,7);mm.strokeStyle='#1c1d33';mm.lineWidth=.9;mm.stroke()}});
}
const clockMM=()=>performance.now()/1000;
MM.addEventListener('click',e=>{if(!S||S.locked||sheetOpen())return;const r=MM.getBoundingClientRect();let x=(e.clientX-r.left)/r.width*392-196,z=(e.clientY-r.top)/r.height*300-150;

/* ---- main loop ---- */
let last=performance.now(),uiT=0;
function loop(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;
  if(!DIR.on){update(dt,now/1000);renderer.render(scene,camera)}
  requestAnimationFrame(loop);
}
function update(dt,t){
  if(S){
    ACT.forEach((A,i)=>{stepActor(A,dt,t);animRobot(ROBOTS[i],A,t)});
    const TA=ACT[S.turn];turnRing.visible=!S.over&&!DIR.cam;
    R3.forEach((w,i)=>{if(w.blocked){w.halo.scale.setScalar(1+.35*Math.sin(t*8+i));w.cars.forEach(c=>{c.mat.emissive.set('#ff2040');c.mat.emissiveIntensity=.25+.25*Math.sin(t*8)})}});turnRing.position.set(TA.x,A0y(TA)+.08,TA.z);turnRing.rotation.z=t;
    CARDS3.forEach((k,i)=>{k.card.position.y=7+Math.sin(t*2+i)*.6;k.card.rotation.y=t*1.4+i;k.ring.scale.setScalar(1+.08*Math.sin(t*4+i))});
    MARKERS.forEach((m,i)=>{m.g.rotation.y=t*1.5+i;m.g.position.y=TOP+11+Math.sin(t*2.4+i)*.5});
    R3.forEach(w=>{const u=t-w.popT;if(u>=0&&u<.7){const s=1+Math.sin(u/.7*Math.PI)*.45;w.cars.forEach((c,k)=>{const v=Math.max(0,Math.min(1,(u-k*.07)/.35));c.g.scale.set(1,1+Math.sin(v*Math.PI)*.8,1)})}else if(u<1)w.cars.forEach(c=>c.g.scale.set(1,1,1))});
    stepFX(dt);stepCam(dt);
    mmT-=dt;if(mmT<=0){mmT=.15;drawMinimap()}
    // city names grow as you zoom out, so the overview stays readable
    {const k=Math.max(.85,Math.min(2.6,CAM.cur/105));if(Math.abs(k-(world.lk||0))>.02){world.lk=k;IDS.forEach(id=>{const l=CITY3[id].lbl;if(!l.userData.base)l.userData.base=[l.scale.x,l.scale.y];l.scale.set(l.userData.base[0]*k,l.userData.base[1]*k,1);l.position.y=4.4+(k-1)*2})}}
    uiT-=dt;if(uiT<=0){uiT=.1;stepUI();stepPostcard();stepDistances();SND.setMood(musicMood())}
    seaTex.offset.x=(t*.004)%1;
  }
}
