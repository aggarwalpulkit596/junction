  ['SBD','AZP','Y',2],['AZP','KSG','Y',3],['KSG','NDL','Y',2],['NDL','RJC','Y',1],['RJC','CSC','Y',1],['CSC','INA','Y',2],
  ['INA','HKS','Y',2],['HKS','QTB','Y',2],['QTB','SKP','Y',3],['SKP','HCC','Y',2],
  // Blue (and its Vaishali branch)
  ['DS21','DWK','B',4],['DWK','JPW','B',3],['JPW','RJG','B',3],['RJG','KTN','B',2],['KTN','RJC','B',4],['RJC','MDH','B',1],
  ['MDH','YMB','B',2],['YMB','MYV','B',1],['MYV','NS18','B',3],['NS18','BTG','B',1],['BTG','NCC','B',2],['NCC','NS52','B',1],
  ['NS52','NEC','B',2],['YMB','KKD','B',3],['KKD','AVH','B',1],['AVH','VSH','B',2],
  // Green
  ['BHG','PGH','G',3],['PGH','PBW','G',3],['PBW','INL','G',2],['INL','KTN','G',2],
  // Violet
  ['KSG','MDH','V',3],['MDH','CSC','V',1],['CSC','LJN','V',2],['LJN','KLK','V',2],['KLK','BDP','V',4],['BDP','RNS','V',4],
  // Pink (the ring)
  ['MJP','AZP','P',1],['AZP','NSP','P',2],['NSP','PBW','P',2],['PBW','RJG','P',1],['RJG','DHK','P',3],['DHK','INA','P',2],
  ['INA','LJN','P',2],['LJN','SKK','P',2],['SKK','MYV','P',1],['MYV','AVH','P',3],['AVH','KKD','P',1],['KKD','WEL','P',2],
  ['WEL','SVH','P',3],['SVH','MJP','P',4],
  // Magenta
  ['JPW','T1','M',3],['T1','HKS','M',4],['HKS','KLK','M',3],['KLK','BTG','M',4],
  // Orange (Airport Express)
  ['NDL','DHK','O',2],['DHK','T3','O',2],['T3','DS21','O',1],
  // any one colour
  ['DWK','NJF','A:Grey Line',2],['SKP','CYB','A:Rapid Metro',2],['NS52','PCK','A:Aqua Line',4],
];
const C={};STATION_DATA.forEach(([id,name,x,y,side])=>{C[id]={id,name,x,y,side}});
const IDS=STATION_DATA.map(s=>s[0]);
const SEGS=SEG_DATA.map(([a,b,line,len],i)=>{
  const any=line.startsWith('A:');
  return{i,a,b,len,c:any?'any':line,line:any?line.slice(2):LINES[line].name+' Line',col:any?ANY_COL:LINES[line].col};
});
const nm=id=>C[id].name;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];

// shortest path by segment cost (costFn(seg) → number or Infinity)
function dijkstra(segs,from,to,costFn){
  const dist={},prev={},done=new Set();IDS.forEach(id=>dist[id]=Infinity);dist[from]=0;
  for(;;){
    let u=null;for(const id of IDS)if(!done.has(id)&&dist[id]<Infinity&&(u===null||dist[id]<dist[u]))u=id;
    if(u===null)return null;if(u===to)break;done.add(u);
    for(const s of segs){if(s.a!==u&&s.b!==u)continue;const v=s.a===u?s.b:s.a,c=costFn(s);if(c===Infinity)continue;
      if(dist[u]+c<dist[v]){dist[v]=dist[u]+c;prev[v]=s}}
  }
  const path=[];let v=to;while(v!==from){const s=prev[v];path.unshift(s);v=s.a===v?s.b:s.a}
  return{cost:dist[to],path};
}
// Destination tickets: every pair of stations 5+ segment-units apart, worth the shortest distance (long ones +2).
const TICKETS=(()=>{const T=[];for(let i=0;i<IDS.length;i++)for(let j=i+1;j<IDS.length;j++){
  const d=dijkstra(SEGS,IDS[i],IDS[j],s=>s.len);if(!d||d.cost<5)continue;
  const long=d.cost>=11;T.push({a:IDS[i],b:IDS[j],p:d.cost+(long?2:0),long})}return T})();
const LONG=TICKETS.filter(t=>t.long),SHORT=TICKETS.filter(t=>!t.long);

/* ===== modes ===== */
const MODES={
  rush:{id:'rush',name:'Rush Hour',blurb:'5–10 minutes',trains:16,turnSec:25,ticketSec:30,clockMin:10,long:false,startOffer:3,keepMin:1,think:1},
  full:{id:'full',name:'Full Line',blurb:'about 20 minutes',trains:24,turnSec:40,ticketSec:50,clockMin:25,long:true,startOffer:4,keepMin:2,think:1.2},
};
const SEAT_COLS=['#14b8a6','#ff4fa3','#c8894a','#9be15d'];
const BOT_NAMES=['Rose','Sandy','Mint','Bolt'];
const MAX_SEATS=4;
const FAIL_EVERY=3;      // a Signal Failure at the start of every 3rd round
const JAM_ROUNDS=2;      // a Jam closes a segment for this many rounds

/* ===== engine ===== */
function makeEngine(){
let S=null,EV=[],PACE=1;
function addLog(t,k=''){S.log.unshift({t,k});S.log=S.log.slice(0,40);S.logN=(S.logN||0)+1}
function ev(e){EV.push(e)}
function draw(){if(!S.deck.length){S.deck=shuffle(S.discard);S.discard=[]}return S.deck.pop()||null}
function give(p,c){if(c)p.hand[c]=(p.hand[c]||0)+1}
const handN=p=>Object.values(p.hand).reduce((a,b)=>a+b,0);
const routePts=pid=>S.segs.filter(s=>s.owner===pid).reduce((a,s)=>a+PTS[s.len],0);
const blocked=s=>!!(s.jam&&s.jam.until>S.round)||!!(S.fail&&S.fail.si===s.i&&S.fail.until>S.round);
function network(p){const n=new Set();S.segs.forEach(s=>{if(s.owner===p.id){n.add(s.a);n.add(s.b)}});return n}
const touches=(p,s)=>{const n=network(p);return n.size===0||n.has(s.a)||n.has(s.b)};
function fixMarket(quiet){
  for(let i=0;i<5;i++)if(!S.market[i])S.market[i]=draw();
  let t=0;while(S.market.filter(c=>c==='W').length>=3&&t<3){S.discard.push(...S.market.filter(Boolean));S.market=[];for(let i=0;i<5;i++)S.market[i]=draw();t++;
    if(!quiet)addLog('Three Smart Cards were face up at once, so the market was redealt.')}
}

/* ---- payment: a segment costs `len` passes of its colour (any one colour for grey segments); Smart Cards are wild.
   A depot run (the segment doesn't touch your network) costs one extra pass of any kind: `e` is that pass. ---- */
function payOptions(p,s,depot){
  const out=[],W=p.hand.W||0,cols=s.c==='any'?COLS:[s.c];
  for(const c of cols){const h=p.hand[c]||0;
    for(let n=Math.min(s.len,h);n>=0;n--){const w=s.len-n;if(w>W)continue;
      if(!depot){out.push({c,n,w,e:null});continue}
      if(h>=n+1)out.push({c,n,w,e:c});
      if(W>=w+1)out.push({c,n,w,e:'W'});
      for(const e of COLS)if(e!==c&&(p.hand[e]||0)>=1)out.push({c,n,w,e});
    }}
  // fewest wilds first, then most of the main colour, then an extra pass from the colour you hold most of
  out.sort((x,y)=>(x.w+(x.e==='W'?1:0))-(y.w+(y.e==='W'?1:0))||(y.n-x.n)||((p.hand[y.e]||0)-(p.hand[x.e]||0)));
  return out;
}
const sameOpt=(a,b)=>a&&b&&a.c===b.c&&a.n===b.n&&a.w===b.w&&(a.e||null)===(b.e||null);
function payPlan(p,o){
  const spend=(c,n)=>{p.hand[c]-=n;for(let i=0;i<n;i++)S.discard.push(c);if(!p.hand[c])delete p.hand[c]};
  if(o.n)spend(o.c,o.n);if(o.w)spend('W',o.w);if(o.e)spend(o.e,1);
}
// the stations a train passes: along your own network from where it stands to the segment, then the segment.
// A depot run is a segment that touches none of your track (your train is hauled there, one extra pass).
function drivePath(p,s){
  const depot=!touches(p,s),own=S.segs.filter(x=>x.owner===p.id);
  const walk=(prev,to)=>{const out=[];for(let v=to;v!==null&&v!==undefined;v=prev[v])out.unshift(v);return out};
  if(!depot&&p.at&&C[p.at]){
    const prev={[p.at]:null},q=[p.at];
    while(q.length){const u=q.shift();for(const x of own){if(x.a!==u&&x.b!==u)continue;const v=x.a===u?x.b:x.a;if(!(v in prev)){prev[v]=u;q.push(v)}}}
    const to=[s.a,s.b].filter(id=>id in prev).sort((x,y)=>walk(prev,x).length-walk(prev,y).length)[0];
    if(to){const path=walk(prev,to);path.push(to===s.a?s.b:s.a);return{path,depot:false}}
  }
  return{path:[s.a,s.b],depot};
}
function claim(p,s,path){s.owner=p.id;p.trains-=s.len;p.at=path[path.length-1];
  addLog(`${p.name} drove ${nm(s.a)} to ${nm(s.b)} (${s.line}, +${PTS[s.len]}).`)}

/* ---- scoring ---- */
function connected(p,a,b){const own=S.segs.filter(s=>s.owner===p.id),seen=new Set([a]),q=[a];
  while(q.length){const u=q.shift();if(u===b)return true;for(const s of own){if(s.a!==u&&s.b!==u)continue;const v=s.a===u?s.b:s.a;if(!seen.has(v)){seen.add(v);q.push(v)}}}return false}
function ticketScore(p){let s=0;const det=p.tickets.map(t=>{const ok=connected(p,t.a,t.b);s+=ok?t.p:-t.p;return ok});return{s,det}}
function longest(pid){const own=S.segs.filter(s=>s.owner===pid);let best=0;
  const go=(at,used,len)=>{best=Math.max(best,len);for(const s of own){if(used.has(s.i)||(s.a!==at&&s.b!==at))continue;used.add(s.i);go(s.a===at?s.b:s.a,used,len+s.len);used.delete(s.i)}};
  own.forEach(s=>{go(s.a,new Set(),0);go(s.b,new Set(),0)});return best}

/* ===== game setup ===== */
function newGame(seats,modeId,now,opts={}){
  const M=MODES[modeId]||MODES.rush;
  // the deck follows the map: more passes for lines with more track
  const units={};COLS.forEach(c=>units[c]=0);SEGS.forEach(s=>{if(s.c!=='any')units[s.c]+=s.len;else COLS.forEach(c=>units[c]+=s.len/COLS.length)});
  const deck=[];COLS.forEach(c=>{const n=Math.max(7,Math.round(units[c]*.62));for(let i=0;i<n;i++)deck.push(c)});for(let i=0;i<12;i++)deck.push('W');
  shuffle(deck);
  const longs=shuffle(LONG.map(t=>({...t}))),shorts=shuffle(SHORT.map(t=>({...t})));
  const far=opts.solo?365*864e5:0; // solo: no turn timer and no game clock
  S={game:'metro',mode:M.id,solo:!!opts.solo,deck,discard:[],market:[],ticketDeck:[],turn:0,round:1,drawn:0,over:false,lastTurns:null,
     phase:'tickets',log:[],startTrains:M.trains,offers:{},plan:null,thinkAt:null,final:null,fail:null,
     segs:SEGS.map(s=>({i:s.i,a:s.a,b:s.b,len:s.len,c:s.c,line:s.line,owner:null,jam:null})),
     startedAt:now,clockEnds:now+M.clockMin*60000+far,ticketEnds:now+M.ticketSec*1000+far,turnEnds:null,turnStart:null,
     players:seats.map((s,i)=>({id:i,name:s.name,col:SEAT_COLS[i],bot:!!s.bot,away:false,hand:{},trains:M.trains,tickets:[],jam:true,at:null}))};
  S.players.forEach(p=>{for(let k=0;k<4;k++)give(p,draw())});
  fixMarket(true);
  S.players.forEach(p=>{const list=M.long?[longs.pop(),...shorts.splice(-(M.startOffer-1))]:shorts.splice(-M.startOffer);S.offers[p.id]={list,min:M.keepMin,initial:true}});
  S.ticketDeck=shorts;
  addLog(`${M.name}: ${M.trains} trains each${opts.solo?'':`, ${M.clockMin} minute clock`}. Choose your destination tickets.`);
  return S;
}

/* ===== actions (humans and bots go through the same door) ===== */
const err=msg=>({ok:false,err:msg}),done=()=>({ok:true});
function act(seat,a,now){
  S.now=now;const p=S.players[seat];
  if(!p||!a||typeof a.t!=='string')return err('Bad action.');
  if(S.over)return err('The game is over.');
  if(a.t==='keep')return keep(p,a.idx,now);
  if(S.phase!=='play')return err('Everyone is still choosing tickets.');
  if(S.turn!==seat)return err('It’s not your turn.');
  if(S.offers[seat])return err('Choose which tickets to keep first.');
  if(a.t==='market'){
    const i=a.i|0,c=S.market[i];if(!c)return err('That pass is gone.');
    if(c==='W'&&S.drawn===1)return err('A face-up Smart Card can’t be your second pass.');
    give(p,c);S.market[i]=draw();fixMarket();ev({k:'pick',s:seat,i,c});
    addLog(`${p.name} took ${c==='W'?'a Smart Card':'a '+LINES[c].name+' pass'}.`);
    if(c==='W'){endTurn(now);return done()}
    S.drawn++;afterDraw(now);return done();
  }
  if(a.t==='deck'){
    const c=draw();if(!c)return err('The deck is empty.');give(p,c);ev({k:'deck',s:seat});
    addLog(`${p.name} drew a pass from the deck.`);
    S.drawn++;afterDraw(now);return done();
  }
  if(S.drawn)return err('Take one more pass to finish your turn.');
  if(a.t==='tickets'){
    if(!S.ticketDeck.length)return err('No tickets left.');
    S.offers[seat]={list:S.ticketDeck.splice(0,3),min:1,initial:false};ev({k:'tix',s:seat});
    S.turnEnds=Math.max(S.turnEnds,now+15000);
    return done();
  }
  if(a.t==='jam'){
    const s=S.segs[a.si|0];if(!s)return err('No such segment.');
    if(!p.jam)return err('You’ve used your Jam.');
    if(s.owner!==null)return err('You can only jam a free segment.');
    if(blocked(s))return err('That segment is already closed.');
    s.jam={s:seat,until:S.round+JAM_ROUNDS};p.jam=false;ev({k:'jam',s:seat,si:s.i});
    addLog(`${p.name} jammed ${nm(s.a)} to ${nm(s.b)} for ${JAM_ROUNDS} rounds.`,'danger');
    return done();
  }
  if(a.t==='drive'){
    const s=S.segs[a.si|0];if(!s)return err('No such segment.');
    if(s.owner!==null)return err('That segment is taken.');
    if(blocked(s))return err(S.fail&&S.fail.si===s.i?'Signal failure: that segment is closed this round.':'That segment is jammed.');
    if(p.trains<s.len)return err(`You only have ${p.trains} train${p.trains===1?'':'s'} left.`);
    const {path,depot}=drivePath(p,s);
    const o=payOptions(p,s,depot).find(x=>sameOpt(x,a.o));if(!o)return err(depot?'A depot run costs one extra pass.':'You can’t pay for that segment.');
    payPlan(p,o);claim(p,s,path);ev({k:'drive',s:seat,si:s.i,path,depot});
    if(depot)addLog(`${p.name} made a depot run to get there.`);
    endTurn(now);return done();
  }
  return err('Unknown action.');
}
function keep(p,idx,now){
  const off=S.offers[p.id];if(!off)return err('No tickets to choose.');
  const k=[...new Set((Array.isArray(idx)?idx:[]).map(i=>i|0).filter(i=>i>=0&&i<off.list.length))];
  if(k.length<off.min)return err(`Keep at least ${off.min}.`);
  off.list.forEach((t,i)=>{if(k.includes(i))p.tickets.push(t);else if(!t.long)S.ticketDeck.push(t)});
  delete S.offers[p.id];
  addLog(`${p.name} kept ${k.length} ticket${k.length>1?'s':''}.`);
  if(off.initial){if(!Object.keys(S.offers).length)startPlay(now);return done()}
  endTurn(now);return done();
}
function startPlay(now){
  S.phase='play';S.turn=0;S.drawn=0;S.turnStart=now;S.turnEnds=now+turnMs();
  addLog(`${S.players[0].name} goes first.`);ev({k:'turn',s:0});
}
const turnMs=()=>S.solo?365*864e5:MODES[S.mode].turnSec*1000;
function afterDraw(now){
  if(S.drawn>=2)return endTurn(now);
  if(!(S.deck.length+S.discard.length)&&!S.market.some(c=>c&&c!=='W')){addLog('No passes left to draw.');endTurn(now)}
}
function endTurn(now){
  if(S.over)return;
  const p=S.players[S.turn];
  if(S.lastTurns===null){
    const why=p.trains<=2?`Only ${p.trains} train${p.trains===1?'':'s'} left for ${p.name}.`:S.segs.every(s=>s.owner!==null)?'Every segment is taken.':now>=S.clockEnds?'Time’s up on the game clock.':null;
    if(why){S.lastTurns=S.players.length+1;addLog(`${why} Everyone gets one final turn.`,'danger');ev({k:'final'})}
  }
  if(S.lastTurns!==null){S.lastTurns--;if(S.lastTurns<=0){finish();return}}
  S.turn=(S.turn+1)%S.players.length;S.drawn=0;S.plan=null;S.thinkAt=null;
  if(S.turn===0){S.round++;if(S.round>60){finish();return}newRound()}
  S.turnStart=now;S.turnEnds=now+turnMs();ev({k:'turn',s:S.turn});
}
function newRound(){
  S.segs.forEach(s=>{if(s.jam&&s.jam.until<=S.round)s.jam=null});
  if(S.fail&&S.fail.until<=S.round)S.fail=null;
  if(S.round>=FAIL_EVERY&&S.round%FAIL_EVERY===0&&S.lastTurns===null){
    const free=S.segs.filter(s=>s.owner===null&&!s.jam);
    if(free.length){const s=pick(free);S.fail={si:s.i,until:S.round+1};ev({k:'fail',si:s.i});
      addLog(`Signal failure between ${nm(s.a)} and ${nm(s.b)}: closed this round.`,'danger')}
  }
}
function finish(){
  S.over=true;S.phase='over';S.plan=null;S.thinkAt=null;S.offers={};
  const lens=S.players.map(p=>longest(p.id)),maxL=Math.max(...lens);
  S.final=S.players.map((p,k)=>{const ts=ticketScore(p),rp=routePts(p.id),ex=(maxL>0&&lens[k]===maxL)?10:0;
    return{s:p.id,rp,tp:ts.s,ex,total:rp+ts.s+ex,len:lens[k],det:ts.det}}).sort((a,b)=>b.total-a.total||b.tp-a.tp);
  S.maxL=maxL;
  addLog(`Game over. ${S.players[S.final[0].s].name} wins with ${S.final[0].total} points.`,'good');ev({k:'over'});
}

/* ===== bots (also play for humans who time out or drop) ===== */
// segments on the cheapest paths of unfinished tickets → priority
function wanted(p){
  const want=new Map(),net=network(p);
  for(const t of p.tickets){
    if(connected(p,t.a,t.b))continue;
    const d=dijkstra(S.segs,t.a,t.b,s=>s.owner===p.id?0:s.owner===null?(blocked(s)?s.len+1.5:s.len+(net.size&&!net.has(s.a)&&!net.has(s.b)?.6:0)):Infinity);
    if(!d||d.cost>p.trains+1)continue;
    d.path.forEach((s,k)=>{if(s.owner===null)want.set(s.i,(want.get(s.i)||0)+t.p/(1+k*.15))});
  }
  return want;
}
function cost(p,t){const d=dijkstra(S.segs,t.a,t.b,s=>s.owner===p.id?0:s.owner===null?s.len:Infinity);return d?d.cost:99}
function botKeepIdx(p,off){
  const sc=off.list.map((t,i)=>({i,c:off.initial?dijkstra(SEGS,t.a,t.b,s=>s.len).cost:cost(p,t)})).sort((a,b)=>a.c-b.c);
  if(off.initial&&off.min>=2)return sc.slice(0,off.min).map(x=>x.i);
  const out=[sc[0].i];
  sc.slice(1).forEach(x=>{if(x.c<=Math.min(5,p.trains-sc[0].c-2))out.push(x.i)});
  while(out.length<off.min)out.push(sc[out.length].i);
  return out;
}
function bestDrive(p,cands){ // cands: [{s, pr}] → the segment worth driving now, with its payment
  let best=null;
  for(const{s,pr}of cands){
    if(s.owner!==null||blocked(s)||p.trains<s.len)continue;
    const depot=!touches(p,s),o=payOptions(p,s,depot)[0];if(!o)continue;
    const sc=s.len*2+pr*.3-(o.w+(o.e==='W'?1:0))*1.5-(depot?1.5:0);
    if(!best||sc>best.sc)best={s,o,sc};
  }
  return best;
}
function botJam(p){
  if(!p.jam||S.round<3||S.lastTurns!==null||Math.random()>.3)return null;
  const rival=S.players.filter(q=>q.id!==p.id).sort((a,b)=>routePts(b.id)-routePts(a.id))[0];
  const want=wanted(rival);let best=null;
  for(const[si,pr]of want){const s=S.segs[si];if(s.owner!==null||blocked(s))continue;if(!best||pr>best.pr)best={si,pr}}
  return best?{t:'jam',si:best.si}:null;
}
function botNext(p){
  const off=S.offers[p.id];
  if(off)return{t:'keep',idx:botKeepIdx(p,off)};
  const want=wanted(p);
  if(S.drawn===0){
    const j=botJam(p);if(j)return j;
    const best=bestDrive(p,[...want].map(([si,pr])=>({s:S.segs[si],pr})));
    if(best)return{t:'drive',si:best.s.i,o:best.o};
    const net=network(p);
    if(handN(p)>=8){ // plenty of passes: grow the network anyway
      const alt=bestDrive(p,S.segs.filter(s=>s.len>=2&&(net.has(s.a)||net.has(s.b)||!net.size)).map(s=>({s,pr:s.len})));
      if(alt)return{t:'drive',si:alt.s.i,o:alt.o};
    }
    if(!want.size){
      if(p.trains>=Math.min(10,Math.round(S.startTrains*.45))&&S.ticketDeck.length&&p.tickets.length<5)return{t:'tickets'};
      const any=bestDrive(p,S.segs.map(s=>({s,pr:(net.has(s.a)||net.has(s.b))?3:0})));
      if(any&&(any.s.len>=2||p.trains<=4))return{t:'drive',si:any.s.i,o:any.o};
    }
    if(Math.random()<.2){const wi=S.market.indexOf('W');if(wi>=0)return{t:'market',i:wi}}
  }
  // draw what the wanted segments need
  const need={};let mostC=COLS[0],mostN=-1;COLS.forEach(c=>{if((p.hand[c]||0)>mostN){mostN=p.hand[c]||0;mostC=c}});
  for(const si of want.keys()){const s=S.segs[si],c=s.c==='any'?mostC:s.c;need[c]=(need[c]||0)+s.len-(p.hand[c]||0)}
  let idx=-1,bv=0;S.market.forEach((c,i)=>{if(c&&c!=='W'&&(need[c]||0)>bv){bv=need[c];idx=i}});
  if(idx>=0)return{t:'market',i:idx};
  if(S.deck.length+S.discard.length)return{t:'deck'};
  const j=S.market.findIndex(x=>x&&x!=='W');if(j>=0)return{t:'market',i:j};
  if(S.drawn===0&&S.market.indexOf('W')>=0)return{t:'market',i:S.market.indexOf('W')};

}

/* ===== the clock: bots think, then act; humans who run out of time are auto-played ===== */
const AWAY_GRACE=3000,THINK=1100;
const autoSeat=(p,now)=>p.bot||now>=S.turnEnds||(p.away&&now>=S.turnStart+AWAY_GRACE);
function run(seat,a,now){const r=act(seat,a,now);if(!r.ok&&S.phase==='play'&&S.turn===seat&&!S.over){S.offers[seat]&&delete S.offers[seat];endTurn(now)}}
function tick(now){
  EV=[];S.now=now;
  for(let guard=0;!S.over&&guard<40;guard++){
    if(S.phase==='tickets'){
      const due=Object.keys(S.offers).map(Number).filter(s=>{const p=S.players[s];return p.bot||p.away||now>=S.ticketEnds});
      if(!due.length)break;
      due.forEach(s=>keep(S.players[s],botKeepIdx(S.players[s],S.offers[s]),now));
      continue;
    }
    const p=S.players[S.turn];
    if(!autoSeat(p,now))break;
    const timedOut=!p.bot&&!p.away&&now>=S.turnEnds;
    if(!timedOut){ // a short think so people can follow along (none when a human's time ran out)
      const k=(MODES[S.mode].think||1)*(S.drawn?.55:1);
      if(!S.thinkAt){S.thinkAt=now+THINK*k*PACE;break}if(now<S.thinkAt)break;
    }
    S.thinkAt=null;
    const a=botNext(p);
    if(!a){endTurn(now);continue}
    run(p.id,a,now);
  }
  return EV;
}
function nextWake(now){
  if(!S||S.over)return null;
  if(S.phase==='tickets'){
    if(Object.keys(S.offers).some(s=>S.players[s].bot||S.players[s].away))return now;
    return S.ticketEnds;
  }
  const p=S.players[S.turn];
  if(p.bot||(p.away&&now>=S.turnStart+AWAY_GRACE)){if(S.thinkAt)return S.thinkAt;return now}
  if(p.away)return Math.min(S.turnEnds,S.turnStart+AWAY_GRACE);
  return S.turnEnds;
}
function handBack(seat){if(S.turn===seat){S.plan=null;S.thinkAt=null}}

/* ===== what one seat may see: everything public, plus its own hand, tickets and offers.
   Seats are rotated so the viewer is always player 0. ===== */
function view(v){
  const n=S.players.length,R=s=>s===null||s===undefined?s:(s-v+n)%n,order=S.players.map((_,i)=>(v+i)%n);
  return{
    game:'metro',mode:S.mode,solo:S.solo,phase:S.phase,over:S.over,turn:R(S.turn),round:S.round,drawn:S.drawn,lastTurns:S.lastTurns,
    market:S.market,deckN:S.deck.length,discardN:S.discard.length,ticketDeckN:S.ticketDeck.length,
    owners:S.segs.map(s=>R(s.owner)),
    jams:S.segs.map(s=>s.jam&&s.jam.until>S.round?{s:R(s.jam.s),until:s.jam.until}:null),
    fail:S.fail&&S.fail.until>S.round?S.fail.si:null,
    players:order.map(s=>{const p=S.players[s],me=s===v;
      return{seat:s,name:p.name,col:p.col,bot:p.bot,away:p.away,trains:p.trains,handN:handN(p),hand:me?p.hand:null,
        tickets:me||S.over?p.tickets:null,ticketsN:p.tickets.length,choosing:!!S.offers[s],jam:p.jam,at:p.at,pts:routePts(s),
        done:me?p.tickets.map(t=>connected(p,t.a,t.b)):null}}),
    offer:S.offers[v]||null,
    log:S.log.slice(0,12),logN:S.logN||0,
    turnEnds:S.turnEnds,ticketEnds:S.ticketEnds,clockEnds:S.clockEnds,startedAt:S.startedAt,
    final:S.final?S.final.map(r=>({...r,s:R(r.s)})):null,maxL:S.maxL||0,
  };
}
function rotEv(e,v){if(e.s===undefined)return e;const n=S.players.length;return{...e,s:(e.s-v+n)%n}}

return{
  newGame,
  act(seat,a,now){EV=[];const r=act(seat,a,now);return{...r,ev:EV}},
  tick,nextWake,view,rotEv,
  botNext:s=>botNext(S.players[s]),
  payOptions:(seat,si)=>{const p=S.players[seat],s=S.segs[si];return s.owner!==null?[]:payOptions(p,s,!touches(p,s))},
  touches:(seat,si)=>touches(S.players[seat],S.segs[si]),
  blocked:si=>blocked(S.segs[si]),
  load(x){S=x},get S(){return S},setPace(k){PACE=k>0?k:1},
  setPos(){},
  setAway(seat,away){const p=S&&S.players[seat];if(!p)return;p.away=!!away;if(!away&&!p.bot)handBack(seat)},
  takeOver(seat,name){const p=S&&S.players[seat];if(p){p.bot=false;p.away=false;p.name=name;handBack(seat);addLog(`${name} joined and took over a robot’s seat.`,'good')}},
  toBot(seat){const p=S&&S.players[seat];if(p){p.bot=true;p.away=false}},
};
}

/* Junction: Delhi Metro — Rush Hour Live, the real-time rules engine.
   Same map and passes as rules.js, no turns. Everybody plays at once for a 3-minute round, best of three:
   - every INCOME_MS the depot sends each driver one pass; extra passes float above stations and go to whichever
     train stands there first;
   - tap a free segment you can pay for and your train sets off at once (first tap takes it); segments touching your
     network are reached along your own track, anything else is a depot run (+1 pass of any kind);
   - trains take real time to travel, so you can't claim again until you arrive; you may shuttle along your own
     network for free to pick up floating passes;
   - Signal Failures close a random free segment for a while; everyone has one Jam per round.
   Scoring per round: segments 1/2/4/7, two secret tickets (+value if joined, −half if not), longest unbroken line +10.
   The commute is won on total.

   Imported as is by worker/index.js (game id 'live') and inlined into metro.html by mp/build.mjs (import/export lines
   stripped, so names must not clash with rules.js: makeLiveEngine, LIVE_MODES). Time is always passed in. */

const LIVE_MODES={
  live:{id:'live',name:'Rush Hour Live',blurb:'3 rounds × 3 minutes, all at once',trains:24,turnSec:0,clockMin:10,
    roundSec:180,rounds:3,breakSec:10,maxTicket:7,missPenalty:.5,incomeMs:3400,spawnMs:2000,maxFloat:8,carMs:900,shuttleCarMs:320,
    failEveryMs:30000,failForMs:12000,jamForMs:20000,botThinkMs:1500,botLazy:.25},
};
function makeLiveEngine(){
let S=null,EV=[],PACE=1;
const M=()=>LIVE_MODES[S.mode]||LIVE_MODES.live;
function addLog(t,k=''){S.log.unshift({t,k});S.log=S.log.slice(0,40);S.logN=(S.logN||0)+1}
function ev(e){EV.push(e)}
function draw(){if(!S.deck.length){S.deck=shuffle(S.discard);S.discard=[]}return S.deck.pop()||null}
function give(p,c){if(c)p.hand[c]=(p.hand[c]||0)+1}
const handN=p=>Object.values(p.hand).reduce((a,b)=>a+b,0);
const own=p=>S.segs.filter(s=>s.owner===p.id);
const routePts=pid=>S.segs.filter(s=>s.owner===pid).reduce((a,s)=>a+PTS[s.len],0);
const blocked=(s,now)=>!!(s.jam&&s.jam.until>now)||!!(S.fail&&S.fail.si===s.i&&S.fail.until>now);
function network(p){const n=new Set();S.segs.forEach(s=>{if(s.owner===p.id){n.add(s.a);n.add(s.b)}});return n}
const touches=(p,s)=>{const n=network(p);return n.size===0||n.has(s.a)||n.has(s.b)};
function connected(p,a,b){const o=own(p),seen=new Set([a]),q=[a];
  while(q.length){const u=q.shift();if(u===b)return true;for(const s of o){if(s.a!==u&&s.b!==u)continue;const v=s.a===u?s.b:s.a;if(!seen.has(v)){seen.add(v);q.push(v)}}}return false}
function longest(pid){const o=S.segs.filter(s=>s.owner===pid);let best=0;
  const go=(at,used,len)=>{best=Math.max(best,len);for(const s of o){if(used.has(s.i)||(s.a!==at&&s.b!==at))continue;used.add(s.i);go(s.a===at?s.b:s.a,used,len+s.len);used.delete(s.i)}};
  o.forEach(s=>{go(s.a,new Set(),0);go(s.b,new Set(),0)});return best}
// shortest way along your own track from `from` to `to`: {path:[stations], cars}
function ownPath(p,from,to){if(from===to)return{path:[from],cars:0};const d=dijkstra(own(p),from,to,s=>s.len);if(!d)return null;
  const path=[from];let at=from;d.path.forEach(s=>{at=s.a===at?s.b:s.a;path.push(at)});return{path,cars:d.cost}}
const livePts=p=>routePts(p.id)+p.tickets.reduce((a,t)=>a+(connected(p,t.a,t.b)?t.p:0),0);

/* ---- payment (as in rules.js, plus the depot-run extra pass `e`) ---- */
function payOptions(p,s,depot){
  const out=[],W=p.hand.W||0,cols=s.c==='any'?COLS:[s.c];
  for(const c of cols){const h=p.hand[c]||0;
    for(let n=Math.min(s.len,h);n>=0;n--){const w=s.len-n;if(w>W)continue;
      if(!depot){out.push({c,n,w,e:null});continue}
      if(h>=n+1)out.push({c,n,w,e:c});if(W>=w+1)out.push({c,n,w,e:'W'});
      for(const e of COLS)if(e!==c&&(p.hand[e]||0)>=1)out.push({c,n,w,e});
    }}
  out.sort((x,y)=>(x.w+(x.e==='W'?1:0))-(y.w+(y.e==='W'?1:0))||(y.n-x.n)||((p.hand[y.e]||0)-(p.hand[x.e]||0)));
  return out;
}
const sameOpt=(a,b)=>a&&b&&a.c===b.c&&a.n===b.n&&a.w===b.w&&(a.e||null)===(b.e||null);
function payPlan(p,o){const spend=(c,n)=>{p.hand[c]-=n;for(let i=0;i<n;i++)S.discard.push(c);if(!p.hand[c])delete p.hand[c]};
  if(o.n)spend(o.c,o.n);if(o.w)spend('W',o.w);if(o.e)spend(o.e,1)}

/* ===== setup ===== */
function newGame(seats,modeId,now,opts={}){
  const m=LIVE_MODES[modeId]||LIVE_MODES.live;
  S={game:'live',mode:m.id,solo:!!opts.solo,round:0,rounds:m.rounds,phase:'between',over:false,startedAt:now,
     deck:[],discard:[],floats:[],fail:null,nextIncome:0,nextSpawn:0,nextFail:0,roundStart:0,roundEnds:0,breakEnds:now,
     segs:[],log:[],logN:0,final:null,commute:null,lastTurns:null,turnEnds:null,clockEnds:now+m.clockMin*60000*m.rounds,
     players:seats.map((s,i)=>({id:i,name:s.name,col:SEAT_COLS[i],bot:!!s.bot,away:false,hand:{},trains:m.trains,tickets:[],jam:true,at:null,moving:null,wins:0,totals:[],nextThink:0}))};
  addLog(`${m.name}: ${m.rounds} rounds of ${m.roundSec/60} minutes. Everyone drives at once.`);
  newRound(now);
  return S;
}
function newRound(now){
  const m=M();S.round++;S.phase='play';S.roundStart=now;S.roundEnds=now+m.roundSec*1000;S.breakEnds=0;S.final=null;
  const units={};COLS.forEach(c=>units[c]=0);SEGS.forEach(s=>{if(s.c!=='any')units[s.c]+=s.len;else COLS.forEach(c=>units[c]+=s.len/COLS.length)});
  const deck=[];COLS.forEach(c=>{const n=Math.max(7,Math.round(units[c]*.62));for(let i=0;i<n;i++)deck.push(c)});for(let i=0;i<12;i++)deck.push('W');
  S.deck=shuffle(deck);S.discard=[];S.floats=[];S.fail=null;
  S.segs=SEGS.map(s=>({i:s.i,a:s.a,b:s.b,len:s.len,c:s.c,line:s.line,owner:null,jam:null}));
  const shorts=shuffle(SHORT.filter(t=>t.p<=m.maxTicket));
  S.players.forEach(p=>{p.hand={};for(let k=0;k<4;k++)give(p,draw());p.trains=m.trains;p.tickets=shorts.splice(-2);p.jam=true;p.at=null;p.moving=null;p.nextThink=now+600+Math.random()*900});
  S.nextIncome=now+m.incomeMs;S.nextSpawn=now+800;S.nextFail=now+m.failEveryMs;
  for(let k=0;k<4;k++)spawn(now,true);
  addLog(`Round ${S.round} of ${S.rounds}: go!`,'good');ev({k:'round',n:S.round});
}
function spawn(now,quiet){
  const taken=new Set(S.floats.map(f=>f.id)),free=IDS.filter(id=>!taken.has(id));if(!free.length)return;
  const id=pick(free),c=draw();if(!c)return;S.floats.push({id,c});if(!quiet)ev({k:'spawn',id,c});
  grabAt(id,now);
}
// a pass floating where a train stands goes to that train (earliest arrival wins)
function grabAt(id,now){
  const fi=S.floats.findIndex(f=>f.id===id);if(fi<0)return;
  const here=S.players.filter(p=>p.at===id&&!p.moving).sort((a,b)=>(a.arrived||0)-(b.arrived||0));if(!here.length)return;
  const p=here[0],f=S.floats.splice(fi,1)[0];give(p,f.c);ev({k:'grab',s:p.id,id,c:f.c});
}

/* ===== actions ===== */
const err=msg=>({ok:false,err:msg}),done=()=>({ok:true});
function act(seat,a,now){
  S.now=now;const p=S.players[seat],m=M();
  if(!p||!a||typeof a.t!=='string')return err('Bad action.');
  if(S.over)return err('The commute is over.');
  if(S.phase!=='play')return err('Next round is about to start.');
  if(a.t==='jam'){
    const s=S.segs[a.si|0];if(!s)return err('No such segment.');
    if(!p.jam)return err('You’ve used your Jam this round.');
    if(s.owner!==null)return err('You can only jam a free segment.');
    if(blocked(s,now))return err('That segment is already closed.');
    s.jam={s:seat,until:now+m.jamForMs};p.jam=false;ev({k:'jam',s:seat,si:s.i});
    addLog(`${p.name} jammed ${nm(s.a)} to ${nm(s.b)}.`,'danger');return done();
  }
  if(p.moving)return err('Your train is still moving.');
  if(a.t==='go'){
    const id=a.id;if(!C[id])return err('No such station.');if(!p.at)return err('Drive a segment first.');
    const w=ownPath(p,p.at,id);if(!w)return err('Your track doesn’t reach there.');if(w.cars===0)return done();
    p.moving={path:w.path,t0:now,t1:now+w.cars*m.shuttleCarMs*PACE,si:null};ev({k:'go',s:seat,path:w.path,t0:p.moving.t0,t1:p.moving.t1});return done();
  }
  if(a.t==='drive'){
    const s=S.segs[a.si|0];if(!s)return err('No such segment.');
    if(s.owner!==null)return err('Too late, that segment is taken.');
    if(blocked(s,now))return err(S.fail&&S.fail.si===s.i?'Signal failure: closed for now.':'Jammed: closed for now.');
    if(p.trains<s.len)return err(`You only have ${p.trains} train${p.trains===1?'':'s'} left.`);
    const depot=!touches(p,s),opts=payOptions(p,s,depot);
    const o=a.o?opts.find(x=>sameOpt(x,a.o)):opts[0];if(!o)return err(depot?'A depot run costs one extra pass.':`You need ${s.len} ${s.c==='any'?'matching':LINES[s.c].name} pass${s.len>1?'es':''}.`);
    let path=[s.a,s.b],shuttle=0;
    if(!depot&&p.at){const wa=ownPath(p,p.at,s.a),wb=ownPath(p,p.at,s.b);const w=[wa,wb].filter(Boolean).sort((x,y)=>x.cars-y.cars)[0];
      if(w){const end=w.path[w.path.length-1];path=w.path.concat(end===s.a?s.b:s.a);shuttle=w.cars}}
    payPlan(p,o);s.owner=seat;p.trains-=s.len;
    p.moving={path,t0:now,t1:now+(shuttle*m.shuttleCarMs+s.len*m.carMs)*PACE,si:s.i};
    ev({k:'drive',s:seat,si:s.i,path,t0:p.moving.t0,t1:p.moving.t1,depot});
    addLog(`${p.name} drove ${nm(s.a)} to ${nm(s.b)} (${s.line}, +${PTS[s.len]}).`);
    return done();
  }
  return err('Unknown action.');
}

/* ===== the clock ===== */
function arrive(p,now){const end=p.moving.path[p.moving.path.length-1];p.at=end;p.moving=null;p.arrived=now;grabAt(end,now)}
function endRound(now){
  const lens=S.players.map(p=>longest(p.id)),maxL=Math.max(...lens);
  const rows=S.players.map((p,k)=>{let tp=0;const det=p.tickets.map(t=>{const ok=connected(p,t.a,t.b);tp+=ok?t.p:-Math.ceil(t.p*M().missPenalty);return ok});
    const rp=routePts(p.id),ex=(maxL>0&&lens[k]===maxL)?10:0;return{s:p.id,rp,tp,ex,total:rp+tp+ex,len:lens[k],det,tickets:p.tickets}}).sort((a,b)=>b.total-a.total||b.rp-a.rp);
  S.final={round:S.round,rows,maxL};
  rows.forEach(r=>S.players[r.s].totals.push(r.total));
  const w=S.players[rows[0].s];w.wins++;
  S.players.forEach(p=>{p.moving=null});
  addLog(`Round ${S.round}: ${w.name} wins with ${rows[0].total}.`,'good');ev({k:'roundEnd',n:S.round});
  if(S.round>=S.rounds){
    S.commute=S.players.map(p=>({s:p.id,total:p.totals.reduce((a,b)=>a+b,0),wins:p.wins,totals:p.totals})).sort((a,b)=>b.total-a.total||b.wins-a.wins);
    S.over=true;S.phase='over';addLog(`Commute over. ${S.players[S.commute[0].s].name} wins with ${S.commute[0].total} points.`,'good');ev({k:'over'});
  }else{S.phase='between';S.breakEnds=now+M().breakSec*1000;S.roundEnds=0}
}
function tick(now){
  EV=[];S.now=now;const m=M();
  if(S.over)return EV;
  if(S.phase==='between'){if(now>=S.breakEnds)newRound(now);else return EV}
  // arrivals
  S.players.forEach(p=>{if(p.moving&&now>=p.moving.t1)arrive(p,now)});
  // income and floating passes
  let guard=0;while(now>=S.nextIncome&&guard++<10){S.players.forEach(p=>{const c=draw();if(c){give(p,c);ev({k:'income',s:p.id,c})}});S.nextIncome+=m.incomeMs*PACE}
  guard=0;while(now>=S.nextSpawn&&guard++<10){if(S.floats.length<m.maxFloat)spawn(now);S.nextSpawn+=m.spawnMs*PACE}
  // closures
  S.segs.forEach(s=>{if(s.jam&&s.jam.until<=now)s.jam=null});
  if(S.fail&&S.fail.until<=now)S.fail=null;
  if(now>=S.nextFail){S.nextFail=now+m.failEveryMs*PACE;const free=S.segs.filter(s=>s.owner===null&&!s.jam);
    if(free.length&&S.roundEnds-now>m.failForMs){const s=pick(free);S.fail={si:s.i,until:now+m.failForMs};ev({k:'fail',si:s.i});addLog(`Signal failure between ${nm(s.a)} and ${nm(s.b)}.`,'danger')}}
  // robots (and humans who are away)
  S.players.forEach(p=>{if(!(p.bot||p.away)||now<p.nextThink)return;p.nextThink=now+(m.botThinkMs*(.7+Math.random()*.6))*PACE;
    if(p.moving||Math.random()<m.botLazy)return;const a=botNext(p,now);if(a)act(p.id,a,now)});
  // round end
  const dead=S.players.every(p=>p.trains<=0||!S.segs.some(s=>s.owner===null&&s.len<=p.trains));
  if(now>=S.roundEnds||dead||S.segs.every(s=>s.owner!==null))endRound(now);
  return EV;
}
function nextWake(now){
  if(!S||S.over)return null;
  if(S.phase==='between')return S.breakEnds;
  const ts=[S.roundEnds,S.nextIncome,S.nextSpawn,S.nextFail];
  if(S.fail)ts.push(S.fail.until);S.segs.forEach(s=>{if(s.jam)ts.push(s.jam.until)});
  S.players.forEach(p=>{if(p.moving)ts.push(p.moving.t1);if(p.bot||p.away)ts.push(p.nextThink)});
  return Math.max(now+40,Math.min(...ts.filter(t=>t>0)));
}

/* ===== robots ===== */
function wanted(p,now){
  const want=new Map(),net=network(p);
  for(const t of p.tickets){
    if(connected(p,t.a,t.b))continue;
    const d=dijkstra(S.segs,t.a,t.b,s=>s.owner===p.id?0:s.owner===null?(blocked(s,now)?s.len+1.5:s.len+(net.size&&!net.has(s.a)&&!net.has(s.b)?.6:0)):Infinity);

function onMyLine(id){return SEGS.some(s=>V.owners[s.i]===0&&(s.a===id||s.b===id))}

function ticketSheet(){

  <button class="btn" data-x="start">Back</button>`,true);
  setTimeout(()=>{const n=$('netName');if(focusCode&&n&&n.value)$('netCode').focus();else if(n)n.focus()},60);
  $('sheetBody').addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.id==='netCode'){e.preventDefault();netJoin()}else if(e.target.id==='netName'){e.preventDefault();(($('netCode').value||'').trim()?netJoin:netCreate)()}});
}
const netMsg=t=>{const m=$('netMsg');if(m)m.textContent=t};
function netName(){const n=(($('netName')&&$('netName').value)||'').trim().slice(0,14);if(!n){netMsg('Type your name first.');$('netName')&&$('netName').focus();return null}store.set('metro-name',n);return n}
async function netCreate(){
  if(!netName())return;netMsg('Creating a room…');
  try{const r=await fetch('/api/rooms',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({game:NET.pickMode==='live'?'live':'metro',mode:NET.pickMode})});const j=await r.json();
    if(!r.ok||!j.code)throw new Error(j.error||'The server said no.');netConnect(j.code,null)}
  catch(e){netMsg('Couldn’t create a room: '+e.message)}
}
async function netJoin(){
  const code=(($('netCode')&&$('netCode').value)||'').toUpperCase().replace(/[^A-Z]/g,'');
  if(code.length!==4){netMsg('Room codes are 4 letters.');$('netCode')&&$('netCode').focus();return}
  if(!netName())return;netMsg('Looking for room '+code+'…');
  try{const r=await fetch('/api/rooms/'+code);const j=await r.json();
    if(!r.ok||!j.exists){netMsg('There’s no room '+code+'. Check the code, or create a new room.');return}
    if(j.game&&j.game!=='metro'&&j.game!=='live'){netMsg('Room '+code+' is a Junction 3D (Europe) room. Opening it there…');setTimeout(()=>location.href='junction3d.html?room='+code,900);return}
    if(j.over)netMsg('That game has finished. Ask the host to start another one.');
    const st=store.get('metro-online');netConnect(code,st&&st.code===code?st.token:null)}
  catch(e){netMsg('Couldn’t reach the server: '+e.message)}
}
function netConnect(code,token){
  E=null;NET.on=true;NET.code=code;NET.token=token||null;NET.closing=false;NET.room=null;NET.retry=0;NET.gameKey=null;
  store.set('metro-online',{code,token:NET.token,t:Date.now()});
  history.replaceState(null,'',location.pathname+'?room='+code);
  sheet(`<div class="kicker">Room ${esc(code)}</div><h3>Connecting…</h3><button class="btn" data-x="leave">Cancel</button>`,true);
  netOpen();
}
function netOpen(){
  const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/api/rooms/'+NET.code+'/ws');NET.ws=ws;
  ws.onopen=()=>ws.send(JSON.stringify({t:'join',name:store.get('metro-name')||'Player',token:NET.token}));
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}NET.retry=0;netOnMsg(m)};
  ws.onclose=()=>{if(NET.ws!==ws)return;NET.ws=null;if(!NET.on||NET.closing)return;NET.retry++;setTimeout(()=>{if(NET.on&&!NET.ws)netOpen()},Math.min(8000,500*2**Math.min(NET.retry,4)))};
}
const netSend=o=>{if(NET.ws&&NET.ws.readyState===1){NET.ws.send(JSON.stringify(o));return true}return false};
function netOnMsg(m){
  if(m.t==='sync'){
    NET.skew=m.now-Date.now();NET.room=m.room;
    if(m.room.token&&m.room.token!==NET.token){NET.token=m.room.token;store.set('metro-online',{code:NET.code,token:NET.token,t:Date.now()})}
    if(m.room.phase==='lobby'||!m.v){NET.gameKey=null;netLobby();return}
    netApply(m.v,m.ev||[]);
  }
  else if(m.t==='emote')feed(`${m.s===0?'You':m.name}: ${m.e}`);
  else if(m.t==='err')feed(m.msg,'danger');
  else if(m.t==='bye')netLeave(m.msg,m.keep);
}
function netLeave(msg,keepSeat){
  NET.closing=true;if(NET.ws){try{NET.ws.close()}catch(e){}}
  Object.assign(NET,{on:false,ws:null,room:null,gameKey:null,offerKey:null,code:null});
  if(!keepSeat)store.del('metro-online');history.replaceState(null,'',location.pathname);
  V=null;E=null;TRAIN.forEach(T=>{T.g.visible=false;T.at=null;T.anim=null});CAM.ride=null;FLOATS.forEach(sp=>G.trains.remove(sp));FLOATS.clear();
  $('players').innerHTML='';$('market').innerHTML='';$('hand').innerHTML='';renderTop();renderStatus();
  startSheet();if(msg)feed(msg,'danger');
}
function netLobby(){
  const R=NET.room,humans=R.seats.filter(Boolean).length;
  sheet(`<div class="kicker">Online room · ${R.host?'you’re the host':'waiting for the host'}</div><h3>Room <span class="code">${esc(R.code)}</span></h3>
  <p class="small">Send friends this link or the code. Up to 4 players.</p>
  <div class="share"><input readonly value="${esc(roomLink())}" aria-label="Invite link"><button class="btn" data-x="copy">Copy</button>${navigator.share?'<button class="btn" data-x="share">Share</button>':''}</div>
  <div class="seats">${[0,1,2,3].map(i=>{const s=R.seats[i];return`<div class="seat ${s?'':'empty'}"><span class="av" style="background:${SEAT_COLS[i]}"></span><span>${s?esc(s.name)+(i===R.you?' (you)':''):'A robot plays here'}</span>${s&&s.host?'<span class="tag">Host</span>':''}${s&&!s.online?'<span class="off">offline</span>':''}</div>`}).join('')}</div>
  <div class="kicker">Game length</div><div class="modes">${Object.entries(R.modes).map(([k,m])=>`<button class="btn ${k===R.mode?'sel':''}" data-netmode="${k}" ${R.host?'':'disabled'} aria-pressed="${k===R.mode}">${esc(m.name)}<small>${esc(m.blurb)} · ${m.trains} trains · ${m.turnSec?m.turnSec+'s turns':'real time'}</small></button>`).join('')}</div>
  ${R.host?`<button class="btn primary" data-x="netstart">Start the game${humans<4?`<small>robots take ${4-humans} seat${4-humans>1?'s':''}</small>`:''}</button>`:'<p class="small">The host starts the game when everyone’s in.</p>'}
  <button class="btn" data-x="leave">Leave room</button>`,true);
}
function netApply(v,ev){
  const fresh=NET.gameKey!==v.startedAt;
  V=v;
  if(fresh){NET.gameKey=v.startedAt;lastLogN=Math.max(0,(v.logN||0)-2);NET.offerKey=null;NET.keep=new Set();NET.finalShown=v.over;jamMode=false;selSeg=null;
    TRAIN.forEach(T=>{T.at=null;T.anim=null});CAM.ride=null;CAM.home();FLOATS.forEach(sp=>G.trains.remove(sp));FLOATS.clear();if(sheetOpen())closeSheet(true)}
  showFreshLog();handleEvents(ev);render();
  if(v.offer){if(!sheetOpen()||$('sheetBody').querySelector('[data-keep]'))ticketSheet()}
  else if($('sheetBody').querySelector('[data-keep]'))closeSheet(true);
  if(v.over&&!NET.finalShown){NET.finalShown=true;setTimeout(LIVE()?commuteSheet:finalSheet,1000)}
  if(LIVE()&&v.phase==='between'&&v.final&&!sheetOpen()&&NET.roundShown!==v.round){NET.roundShown=v.round;roundSheet()}
}

/* ---- wiring ---- */
$('market').addEventListener('click',e=>{const b=e.target.closest('[data-mk]');if(!b||!V)return;
  if(!myTurn()){feed(V.phase==='tickets'?'Choose your tickets first.':'Wait for your turn.','danger');return}
  const k=b.dataset.mk;
  if(k==='deck'){if(V.deckN+V.discardN<1){feed('The deck is empty.','danger');return}send({t:'deck'});return}
  if(k==='tix'){if(V.drawn){feed('Finish drawing passes first.','danger');return}if(!V.ticketDeckN){feed('No tickets left.','danger');return}ticketSheet();return}
  const i=+k,c=V.market[i];if(!c)return;if(c==='W'&&V.drawn===1){feed('A face-up Smart Card can’t be your second pass.','danger');return}
  send({t:'market',i});
});
$('hand').addEventListener('click',e=>{const b=e.target.closest('#jamBtn');if(!b||b.disabled)return;jamMode=!jamMode;render()});
$('menuBtn').onclick=()=>menuSheet();
$('logBtn').onclick=()=>logSheet();
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
function netBoot(){
  const q=new URLSearchParams(location.search).get('room');if(!q)return false;
  const code=q.toUpperCase().replace(/[^A-Z]/g,'').slice(0,4);
  if(!canOnline()){onlineSheet(code);return true}
  const st=store.get('metro-online');
  if(st&&st.code===code&&st.token&&store.get('metro-name')){netConnect(code,st.token);return true}
  onlineSheet(code,true);return true;
}
async function boot(){
  const th=store.get('metro-theme');if(th)document.documentElement.dataset.theme=th;
  try{await Promise.race([Promise.all([document.fonts.load('800 14px Nunito'),document.fonts.load('700 20px Fredoka')]),new Promise(r=>setTimeout(r,2000))])}catch(e){}
  buildMap();resize();requestAnimationFrame(frame);$('boot').remove();
  if(!netBoot()){if(!store.get('metro-help-seen')){store.set('metro-help-seen',1);helpSheet()}else startSheet()}
}
boot();
/* test hooks */
window.J={get V(){return V},get E(){return E},get NET(){return NET},send,newSolo,netSend,tapSeg,payOptionsV,touchesV,blockedV,myTurn,LIVE,canActLive,onMyLine,ticketSheet,closeSheet,SEGS,C,MODES,LIVE_MODES,
  keepAll(){if(!V||!V.offer)return false;NET.keep=new Set(V.offer.list.map((_,i)=>i));NET.offerKey=JSON.stringify(V.offer.list);send({t:'keep',idx:[...NET.keep]});return true}};
</script>
</body>
