<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Junction 3D: Saboteur Express</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/*@@STYLE@@*/
/* ===== 3D layout ===== */
html,body{height:100%;overflow:hidden}
body{background:#bfe4f6;user-select:none;-webkit-user-select:none}
#world{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.hud{position:fixed;z-index:5}
#hudTop{top:calc(8px + env(safe-area-inset-top,0px));left:8px;right:62px;max-width:560px;margin:0 auto}
#hudTop .roster{margin-bottom:6px;gap:6px}
#hudTop .mate{padding:4px 2px 5px;border-radius:12px}
#hudTop .mate svg{width:18px;height:25px}
#hudTop .mate .nm{font-size:13px}
#hudTop .mate .meta{font-size:10.5px}
#hudTop .status{font-size:13px;min-height:38px;padding:7px 11px;margin:0}
#hudRight{top:calc(8px + env(safe-area-inset-top,0px));right:8px;display:flex;flex-direction:column;gap:8px}
#hudRight .iconbtn{font-size:15px}
#hudRight .iconbtn[aria-pressed="false"]{opacity:.5}
#hudRight #ffBtn[aria-pressed="true"]{background:var(--accent);opacity:1}
#hudLeft{top:calc(156px + env(safe-area-inset-top,0px));left:8px;width:172px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
#hudLeft>*{pointer-events:auto}
.mini{padding:8px 9px 7px;margin:0}
.mini .mh{font-family:'Fredoka';font-weight:600;font-size:14px;margin-bottom:3px;display:flex;justify-content:space-between;align-items:baseline}
.mini .mh small{font-family:'Nunito';font-weight:700;font-size:10.5px;color:var(--muted)}
#hudLeft{width:196px}
.mapmini{padding:5px}
#minimap{width:100%;display:block;border-radius:10px;cursor:pointer;touch-action:none}
.ticket[data-walkt]{cursor:pointer}
.mkrow{display:flex;align-items:center;gap:7px;width:100%;background:none;border:0;padding:3px 3px;font-weight:800;font-size:13px;text-align:left;border-radius:8px}
.mkrow:hover{background:var(--card)}
.mkrow .d{margin-left:auto;color:var(--muted);font-size:11px;font-weight:700}
#feed{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:5px;pointer-events:none}
#feed li{background:var(--panel);border:2px solid var(--outline);border-radius:10px;padding:5px 8px;font-size:12px;line-height:1.3;box-shadow:0 2px 0 var(--outline);animation:fadeout 7s forwards}
#feed li.good{border-color:var(--good)}
#feed li.danger{border-color:var(--danger)}
@keyframes fadeout{0%,82%{opacity:1}100%{opacity:0}}
#hudBottom{left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:flex-end;justify-content:space-between;pointer-events:none}
#hudBottom>*{pointer-events:auto}
.handp{margin:0;max-width:430px;flex:0 1 430px;padding:9px 10px 10px}
.handp .ph{margin-bottom:4px}
.handp .cardface{width:38px;height:50px;border-radius:8px}
.handp .cardface svg{width:24px;height:16px}
.handp .cardface .cl{font-size:9px;line-height:13px}
.handp .handrow{gap:10px}
.actcol{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.actcol .row{display:flex;gap:8px}
.actcol .btn{padding:9px 12px;font-size:13.5px}
#chips{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
#chips .btn{padding:7px 11px;font-size:12.5px;background:var(--panel)}
.use{width:98px;height:98px;border-radius:50%;border:3px solid var(--outline);background:var(--accent);color:var(--accentInk);box-shadow:0 5px 0 var(--outline);font-family:'Fredoka';font-weight:700;font-size:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:8px;line-height:1}
.use small{font-family:'Nunito';font-weight:800;font-size:10.5px;line-height:1.15;max-width:82px;text-align:center}
.use:disabled{opacity:.45;cursor:default}
.use.go{animation:pulse 1.3s ease-in-out infinite}
.use:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--outline)}
@keyframes pulse{50%{transform:scale(1.06)}}
#postcard{bottom:calc(150px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:min(430px,calc(100% - 24px));background:var(--panel);border:2.5px solid var(--outline);border-radius:16px;padding:10px 12px;box-shadow:0 4px 0 var(--outline);pointer-events:none}
#postcard .pt{display:flex;gap:10px;align-items:center}
#postcard p{font-size:13px;margin-top:5px;line-height:1.35}
#postcard h3{font-size:18px;line-height:1.1}
#postcard .pcE{width:44px;height:44px;font-size:26px}
#tixPanel{right:8px;bottom:calc(214px + env(safe-area-inset-bottom,0px));width:min(320px,calc(100% - 16px));margin:0;max-height:42vh;overflow:auto}
.userow{align-items:flex-end}
.use.meet{width:74px;height:74px;background:var(--danger);color:#fff;font-size:30px}
.use.meet small{font-size:10px}
.use.meet:not(:disabled){animation:pulse 1.6s ease-in-out infinite}
.mate{position:relative}.mate.out{opacity:.4}
.mate .flag{position:absolute;top:2px;right:5px;font-size:11px;font-weight:800}.mate .flag.ok{color:var(--good)}
#alarm{inset:0;pointer-events:none;opacity:0;box-shadow:inset 0 0 180px 40px rgba(255,40,60,.85);transition:opacity .2s}
#alarm.on{opacity:1;animation:alarm .6s ease-in-out infinite alternate}
@keyframes alarm{from{box-shadow:inset 0 0 120px 20px rgba(255,40,60,.6)}to{box-shadow:inset 0 0 220px 60px rgba(255,40,60,.95)}}
.task{border:2.5px solid var(--accent);border-radius:14px;padding:11px 12px;margin:2px 0 12px}
.task .q{font-weight:800;margin-bottom:9px;font-size:15px}
.opts{display:flex;flex-direction:column;gap:8px}
.votes{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:6px 0 6px}
.vote{border:2.5px solid var(--outline);background:var(--card);border-radius:14px;padding:10px 4px;text-align:center;font-family:'Fredoka';font-weight:600;font-size:16px;box-shadow:0 3px 0 var(--outline)}
.vote svg{width:34px;height:46px;display:block;margin:0 auto 4px}
.vote small{display:block;font-family:'Nunito';font-weight:800;color:var(--good);font-size:11px}
.vote:disabled{opacity:.55;cursor:default}
.chat{display:flex;flex-direction:column;gap:7px;margin:8px 0 12px;max-height:34vh;overflow:auto}
.say{display:flex;gap:9px;align-items:flex-start;background:var(--card);border-radius:12px;padding:8px 10px;animation:up .2s ease-out}
.say>svg{width:22px;height:30px;flex:none}
.say b{font-family:'Fredoka';font-weight:600;font-size:14px}
.sheet .say p{margin:0;font-size:14.5px}
.note.ev{font-size:13px;border-left:4px solid var(--danger)}
.chips{display:flex;gap:2px;justify-content:center;min-height:22px;margin-top:4px;flex-wrap:wrap}
.vote .chips svg,.btn .chips svg{width:14px;height:19px;margin:0;display:inline-block}
.btn .chips{display:inline-flex;vertical-align:middle;margin:0 0 0 6px}
.vote.mine,.btn.mine{outline:3px solid var(--accent);outline-offset:2px}
.note.verdict{font-size:16px;font-weight:800}
#logList{list-style:none;padding:0;display:flex;flex-direction:column;gap:7px;font-size:14px}
#logList li{padding-left:10px;border-left:3px solid var(--line)}#logList li.danger{border-color:var(--danger)}#logList li.good{border-color:var(--good)}
#hint{left:50%;bottom:calc(122px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:12px;color:var(--ink);background:rgba(255,255,255,.75);border-radius:999px;padding:3px 10px;font-weight:700;pointer-events:none;white-space:nowrap}
#boot{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#bfe4f6;font-family:'Fredoka';font-size:22px;color:#1c1d33;text-align:center;padding:24px}
.keys{display:inline-block;border:2px solid var(--outline);border-radius:6px;padding:0 5px;font-size:12px;font-weight:800;margin:0 1px}
/* online play: room bar, lobby, join form */
.netbar{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;align-items:center}
.netbar[hidden]{display:none}
.nb{background:var(--panel);border:2px solid var(--outline);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800;box-shadow:0 2px 0 var(--outline);line-height:1.5;white-space:nowrap}
.nb.hot{background:var(--danger);color:#fff}
.nb.em{padding:2px 7px}
.emotes{display:flex;gap:4px;margin-left:auto}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:800;color:var(--muted);margin:4px 0 10px}
.field input,.joinrow input,.share input{font:inherit;font-size:16px;font-weight:800;color:var(--ink);background:var(--card);border:2.5px solid var(--outline);border-radius:12px;padding:10px 12px;width:100%;min-width:0;user-select:text;-webkit-user-select:text}
.joinrow{display:flex;gap:8px}.joinrow input{text-transform:uppercase;letter-spacing:.2em;font-family:'Fredoka';flex:1}
.share{display:flex;gap:8px;margin:4px 0 12px}.share input{font-size:13px}
.code{font-family:'Fredoka';letter-spacing:.12em;background:var(--accent);color:var(--accentInk);border:2.5px solid var(--outline);border-radius:10px;padding:0 8px}
.seats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 12px}
.seat{display:flex;align-items:center;gap:6px;border:2.5px solid var(--outline);border-radius:12px;padding:7px 9px;background:var(--card);font-weight:800;font-size:14px;min-width:0}
.seat .sn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat svg{width:20px;height:27px;flex:none}
.seat.empty{border-style:dashed;opacity:.7;font-weight:700}
.seat .off{font-size:11px;color:var(--danger);margin-left:auto}
.seat .tag{margin-left:auto}
.btn.sel:disabled{opacity:1}
.orline{text-align:center;margin:14px 0 8px}
.tixlist{list-style:none;padding:0;margin:0 0 10px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.tixlist .bad{color:var(--danger)}.tixlist .ok{color:var(--good)}
@media (max-width:640px){
  #hudLeft{width:150px;top:calc(146px + env(safe-area-inset-top,0px))}
  .mkrow{font-size:12px}
  .handp{padding:7px 8px 8px}
  .handp .cardface{width:32px;height:43px}
  .handp .handrow{gap:8px}
  .handp h2{font-size:14px}
  .use{width:86px;height:86px;font-size:22px}
  #hint{display:none}
  #hudTop .status{font-size:12px;min-height:34px;padding:6px 9px}
  #hudLeft{width:128px}
  .mini{padding:6px 7px 5px}
  .mini .mh{font-size:12.5px}
  .mini .mh small{display:none}
  .mkrow{font-size:11.5px;padding:2px}
  .mkrow .sw{width:13px;height:13px}
  #feed li:nth-child(n+2){display:none}
  #feed li{font-size:11px}
  .actcol .btn{padding:7px 9px;font-size:12px}
  #postcard{top:calc(146px + env(safe-area-inset-top,0px));bottom:auto;left:auto;right:8px;transform:none;width:calc(100% - 152px);padding:7px 9px}
  #postcard p{display:none}
  #postcard h3{font-size:15px}
  #postcard .pcE{width:36px;height:36px;font-size:20px}
}
</style>
</head>
<body>
<canvas id="world" tabindex="0" aria-label="3D rail map of Europe. Walk your robot with WASD or arrow keys, or tap the ground."></canvas>
<div id="hudTop" class="hud">
  <div class="roster" id="roster"></div>
  <div class="status" id="status" role="status" aria-live="polite"></div>
  <div class="netbar" id="netbar" hidden><button class="nb" id="nbRoom" aria-label="Room menu">Room</button><span class="nb" id="nbTurn" aria-live="off"></span><span class="nb" id="nbClock"></span><span class="emotes" id="nbEmotes"></span></div>
</div>
<div id="hudRight" class="hud">
  <button class="iconbtn" id="helpBtn" aria-label="Rules">?</button>
  <button class="iconbtn" id="mapBtn" aria-label="Map view (M)" aria-pressed="false">Map</button>
  <button class="iconbtn" id="logBtn" aria-label="Ship log (L)">Log</button>
  <button class="iconbtn" id="sndBtn" aria-label="Sound effects" aria-pressed="true">🔊</button>
  <button class="iconbtn" id="musBtn" aria-label="Music" aria-pressed="true">♪</button>
  <button class="iconbtn" id="ffBtn" aria-label="Fast bots (F)" aria-pressed="false">⏩</button>
  <button class="iconbtn" id="zin" aria-label="Zoom in">+</button>
  <button class="iconbtn" id="zout" aria-label="Zoom out">−</button>
</div>
<div id="hudLeft" class="hud">
  <div class="panel mini mapmini"><canvas id="minimap" width="784" height="600" aria-label="Minimap of Europe. Tap to walk there."></canvas></div>
  <div class="panel mini"><div class="mh">Floating cards <small>tap to walk</small></div><div id="mkt"></div></div>
  <ol id="feed" aria-live="polite"></ol>
</div>
<div id="postcard" class="hud" hidden></div>
<div id="hint" class="hud">Walk: <span class="keys">W</span><span class="keys">A</span><span class="keys">S</span><span class="keys">D</span> or tap the ground · Use: <span class="keys">E</span> · Meeting: <span class="keys">R</span> · Map: <span class="keys">M</span></div>
<div id="tixPanel" class="hud panel" hidden><div class="ph"><h2>Your tickets</h2><span class="hint" id="cards"></span></div><div class="tix" id="tickets"></div></div>
<div id="hudBottom" class="hud">
  <section class="panel handp"><div class="ph"><h2>Your hand</h2><span class="hint" id="trains"></span></div><div class="handrow" id="hand"></div></section>
  <div class="actcol">
    <div id="chips"></div>
    <div class="row"><button class="btn" id="mytixBtn" aria-expanded="false">Tickets</button><button class="btn" id="deckBtn">Deck</button></div>
    <button class="btn" id="tixBtn">Draw tickets</button>
    <div class="row userow"><button id="meetBtn" class="use meet" disabled aria-label="Emergency meeting (R)"><span>!</span><small id="meetLbl">Meeting</small></button>
    <button id="useBtn" class="use" disabled aria-label="Use"><span>USE</span><small id="useLbl"></small></button></div>
  </div>
</div>
<div class="overlay hidden" id="sheet"><div class="sheet" id="sheetBody" role="dialog" aria-modal="true"></div></div>
<div id="alarm" class="hud"></div>
<div id="boot">Building Europe…</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js';

/*@@DATA@@*/

/* ===== state ===== */
const PLAYERS=[
  {id:0,name:'You',col:'#14b8a6',human:true},{id:1,name:'Rose',col:'#ff4fa3'},
  {id:2,name:'Sandy',col:'#c8894a'},{id:3,name:'Mint',col:'#9be15d'}
];
let S=null;const H=()=>S.players[0];
let GEN=0,FAST=false;
const sleep=ms=>FAST?Promise.resolve():new Promise(r=>setTimeout(r,ms));

function newGame(trains,silent){
  GEN++;
  const deck=[];COLS.forEach(c=>{for(let i=0;i<12;i++)deck.push(c)});for(let i=0;i<14;i++)deck.push('loco');
  shuffle(deck);
  const longs=shuffle(LONG.map(t=>({...t}))),shorts=shuffle(SHORT.map(t=>({...t})));
  S={deck,discard:[],market:[],marketCity:[],ticketDeck:[],turn:0,round:1,drawn:0,busy:false,over:false,locked:!!silent,lastTurns:null,
     selected:null,stationAt:{},log:[],startTrains:trains,
     routes:ROUTES.map(r=>({...r,owner:null,blocked:0})),
     players:PLAYERS.map(p=>({...p,hand:{},trains,stations:3,tickets:[],alive:true,cleared:false,pos:null}))};
  S.sab=1+rand(3);S.sabotages=0;S.sabRound=0;S.caught=false;S.meetingUsed=false;S.meetingPts=0;S.taskUsed=false;S.tasksDone={};
  resetActors();
  S.players.forEach(p=>{for(let k=0;k<4;k++)give(p,draw())});
  for(let k=0;k<5;k++)setSlot(k,draw());fixMarket(true);
  const offers=S.players.map(()=>[longs.pop(),shorts.pop(),shorts.pop(),shorts.pop()]);
  S.ticketDeck=shorts;
  for(let i=1;i<4;i++){
    const o=offers[i].map(t=>({t,c:dijkstra(ROUTES,t.a,t.b,r=>r.len).cost})).sort((x,y)=>x.c-y.c);
    S.players[i].tickets=[o[0].t,o[1].t];o.slice(2).forEach(x=>{if(!x.t.long)S.ticketDeck.push(x.t)});
  }
  $('feed').innerHTML='';
  addLog(`New game with ${trains} trains each. One of the other robots is a saboteur. Choose your destination tickets.`);
  render();
  if(!silent)offerTickets(offers[0],2,true);
}
function draw(){if(!S.deck.length){S.deck=shuffle(S.discard);S.discard=[]}return S.deck.pop()||null}
function give(p,c){if(c)p.hand[c]=(p.hand[c]||0)+1}
function addLog(t,k=''){
  S.log.unshift({t,k});S.log=S.log.slice(0,40);
  if(FAST)return;
  const f=$('feed'),li=document.createElement('li');li.className=k;li.textContent=t;f.prepend(li);
  while(f.children.length>4)f.lastChild.remove();
  setTimeout(()=>li.remove(),7000);
}
/* face-up cards float above cities: each market slot has a card and a city */
function setSlot(i,c){S.market[i]=c;S.marketCity[i]=c?pickCity(i):null}
function pickCity(i){
  const used=new Set(S.marketCity.filter((c,j)=>j!==i&&c));
  let cands=IDS.filter(id=>!used.has(id));
  const far=cands.filter(id=>ACT.every(A=>Math.hypot(A.x-WX(id),A.z-WZ(id))>10));
  if(far.length)cands=far;
  return pick(cands);
}
function fixMarket(quiet){
  for(let i=0;i<5;i++)if(!S.market[i])setSlot(i,draw());
  let t=0;
  while(S.market.filter(c=>c==='loco').length>=3&&t<3){
    S.discard.push(...S.market.filter(Boolean));for(let i=0;i<5;i++)setSlot(i,draw());t++;
    if(!quiet)addLog('Three locomotives were floating at once, so all the cards were redealt.');
  }
}
const nbrs=id=>ADJ[id].map(ri=>{const r=ROUTES[ri];return r.a===id?r.b:r.a});
const reachable=id=>S.routes.some(r=>r.owner===0&&(r.a===id||r.b===id))||S.stationAt[id]===0;
const canAct=()=>S&&!S.busy&&!S.over&&!S.locked&&S.turn===0;
const routePts=pid=>S.routes.filter(r=>r.owner===pid).reduce((s,r)=>s+PTS[r.len],0);

/*@@PAYMENT@@*/

/* ===== turn flow (bots walk to where they act) ===== */
async function endTurn(){
  if(S.over)return;
  const g=GEN,p=S.players[S.turn];
  if(S.lastTurns===null&&(p.trains<=2||S.routes.every(r=>r.owner!==null))){S.lastTurns=S.players.filter(q=>q.alive).length+1;SND.ready&&SND.fx.finalRound();addLog(p.trains<=2?`${p.human?'You have':p.name+' has'} ${p.trains} trains left. Everyone gets one final turn.`:'Every route is taken. Everyone gets one final turn.','danger')}
  if(S.lastTurns!==null){S.lastTurns--;if(S.lastTurns<=0){endGame();return}}
  do{S.turn=(S.turn+1)%S.players.length;
    if(S.turn===0){S.round++;S.taskUsed=false;S.routes.forEach(r=>{if(r.blocked>0)r.blocked--})}
  }while(!S.players[S.turn].alive);
  S.drawn=0;S.selected=null;
  if(S.round>60){endGame();return}
  const q=S.players[S.turn];
  if(q.human){S.busy=false;render();SND.ready&&SND.fx.yourTurn();return}
  S.busy=true;render();
  await sleep(FF?60:200);
  if(g!==GEN||S.over)return;
  await botTurn(q);
  if(g!==GEN||S.over)return;
  render();
  return endTurn();
}

/* ===== human actions ===== */
function takeMarket(i){
  if(!canAct())return;const c=S.market[i];if(!c)return;
  if(c==='loco'&&S.drawn===1){addLog('A floating locomotive can’t be your second card.','danger');return}
  const city=S.marketCity[i];
  give(H(),c);fx.pickup(city,c);setSlot(i,draw());fixMarket();
  addLog(`You took ${c==='loco'?'a floating locomotive':'a '+c+' card'} in ${nm(city)}.`);
  if(c==='loco'){endTurn();return}
  S.drawn++;afterDraw();
}
function takeDeck(){
  if(!canAct())return;const c=draw();if(!c)return;give(H(),c);
  addLog(`You drew ${c==='loco'?'a locomotive':'a '+c+' card'} from the deck.`);
  S.drawn++;afterDraw();
}
/*@@HUMAN@@*/

/* ===== bots ===== */
/*@@WANTED@@*/
/* ---- talking robots: each robot suspects the others from what it saw and heard, accuses, lies (the saboteur) and votes ---- */
const aliveBots=()=>S.players.filter(p=>!p.human&&p.alive);
const susOf=(b,q)=>(S.sus&&S.sus[b]&&S.sus[b][q])||0;
function addSus(b,q,v){if(b===q||!S.players[q].alive||(S.players[q].cleared&&v>0))return;S.sus=S.sus||{};const m=S.sus[b]=S.sus[b]||{};m[q]=Math.max(0,(m[q]||0)+v)}
function recordSabotage(p,r,wit,line){

function stepActor(A,dt,t){
  if(S&&!S.players[A.id].alive)return;
  let vx=0,vz=0;
  if(A.id===0&&!sheetOpen()){
    vx=(KEYS.has('d')||KEYS.has('arrowright')?1:0)-(KEYS.has('a')||KEYS.has('arrowleft')?1:0);
    vz=(KEYS.has('s')||KEYS.has('arrowdown')?1:0)-(KEYS.has('w')||KEYS.has('arrowup')?1:0);
    if(vx||vz){A.path=null;const n=Math.hypot(vx,vz);vx/=n;vz/=n}
  }
  const busyBot=A.id!==0&&S&&S.turn===A.id&&S.busy;
  const speed=(A.spd??(A.id===0?24:busyBot?(A.path&&A.path.length>2?80:50)*(FF?2.4:1):18))*dt; // bots stroll when idle, hurry on their turn
  if(!vx&&!vz&&A.path&&A.path.length){
    const[tx,tz]=A.path[0],dx=tx-A.x,dz=tz-A.z,d=Math.hypot(dx,dz);
    if(d<=speed){A.x=tx;A.z=tz;A.path.shift();vx=dx/(d||1)*.001;vz=dz/(d||1)*.001;
      if(!A.path.length){A.path=null;const f=A.onArrive;A.onArrive=null;if(f)f()}}
    else{vx=dx/d;vz=dz/d;A.x+=vx*speed;A.z+=vz*speed}
  }else if(vx||vz){ // keyboard walking: slide along coasts like a wall
    const nx=A.x+vx*speed,nz=A.z+vz*speed;
    if(walkable(nx,nz)){A.x=nx;A.z=nz}else if(walkable(nx,A.z)){A.x=nx;vz=0}else if(walkable(A.x,nz)){A.z=nz;vx=0}
    else{let ok=false;for(const a of [.6,-.6,1.1,-1.1]){const c=Math.cos(a),s2=Math.sin(a),rx=vx*c-vz*s2,rz=vx*s2+vz*c;if(walkable(A.x+rx*speed,A.z+rz*speed)){A.x+=rx*speed;A.z+=rz*speed;vx=rx;vz=rz;ok=true;break}}if(!ok)vx=vz=0}
  }

}

const MM=$('minimap'),mm=MM.getContext('2d'),MK=2;let mmBase=null,mmT=0;
function mmBuild(){
  mmBase=document.createElement('canvas');mmBase.width=MM.width;mmBase.height=MM.height;const x=mmBase.getContext('2d');x.scale(MK,MK);
  x.fillStyle='#6fc3ea';x.fillRect(0,0,392,300);x.fillStyle='#f3df9f';x.strokeStyle='#1c1d33';x.lineWidth=.8;x.lineJoin='round';
  const poly=P=>{x.beginPath();P.forEach(([wx,wz],i)=>i?x.lineTo(wx+196,wz+150):x.moveTo(wx+196,wz+150));x.closePath()};
  LANDPOLY.forEach(P=>{poly(P);x.fill();x.stroke()});x.fillStyle='#6fc3ea';poly(SEAPOLY);x.fill();x.stroke();
}
function drawMinimap(){
  if(!S)return;if(!mmBase)mmBuild();
  mm.setTransform(1,0,0,1,0,0);mm.drawImage(mmBase,0,0);mm.setTransform(MK,0,0,MK,0,0);
  const P=(id)=>[C[id].x,C[id].y];
  S.routes.forEach(r=>{const[a1,a2]=P(r.a),[b1,b2]=P(r.b);mm.beginPath();mm.moveTo(a1,a2);mm.lineTo(b1,b2);
    if(r.blocked){mm.setLineDash([3,2]);mm.strokeStyle='#ff3b4f';mm.lineWidth=3}else if(r.owner!==null){mm.setLineDash([]);mm.strokeStyle=PLAYERS[r.owner].col;mm.lineWidth=3.2}
    else{mm.setLineDash([]);mm.strokeStyle=HEX[r.color];mm.globalAlpha=.55;mm.lineWidth=1.6}
    mm.stroke();mm.globalAlpha=1;mm.setLineDash([])});
  const own0=new Set();S.routes.forEach(r=>{if(r.owner===0){own0.add(r.a);own0.add(r.b)}});
  IDS.forEach(id=>{const[x,y]=P(id);mm.beginPath();mm.arc(x,y,2.6,0,7);mm.fillStyle=own0.has(id)?'#ffc933':'#fff';mm.fill();mm.lineWidth=.8;mm.strokeStyle='#1c1d33';mm.stroke()});
  // your unfinished ticket cities
  const det=H().tickets.length?ticketScore(H()).det:[];H().tickets.forEach((t,i)=>{if(det[i])return;[t.a,t.b].forEach(id=>{const[x,y]=P(id);mm.beginPath();mm.arc(x,y,6+Math.sin(clockMM()*4)*1,0,7);mm.strokeStyle='#e8a400';mm.lineWidth=1.8;mm.stroke()})});
  // floating cards
  S.market.forEach((c,i)=>{if(!c)return;const[x,y]=P(S.marketCity[i]);mm.save();mm.translate(x,y-7);mm.rotate(Math.PI/4);mm.fillStyle=c==='loco'?'#ffc933':HEX[c];mm.fillRect(-2.6,-2.6,5.2,5.2);mm.lineWidth=.8;mm.strokeStyle='#1c1d33';mm.strokeRect(-2.6,-2.6,5.2,5.2);mm.restore()});
  // what the camera sees
  const hw=Math.max(18,CAM.cur*.42*Math.min(1.6,camera.aspect)),hh=Math.max(14,CAM.cur*.5);
  mm.strokeStyle='rgba(28,29,51,.55)';mm.lineWidth=1;mm.strokeRect(CAM.x+196-hw,CAM.z+150-hh*.75,hw*2,hh*1.4);
  // robots
  ACT.forEach((A,i)=>{if(S.players[i].alive===false)return;const x=A.x+196,y=A.z+150,me=i===0;mm.beginPath();mm.arc(x,y,me?5:3.8,0,7);mm.fillStyle=PLAYERS[i].col;mm.fill();mm.lineWidth=me?1.6:1;mm.strokeStyle=me?'#fff':'#1c1d33';mm.stroke();if(me){mm.beginPath();mm.arc(x,y,6.6,0,7);mm.strokeStyle='#1c1d33';mm.lineWidth=.9;mm.stroke()}});
}

/* ---- the connection ---- */
function netConnect(code,token){
  NET.on=true;NET.code=code;NET.token=token||null;NET.closing=false;NET.room=null;NET.v=null;NET.retry=0;
  store.set('junction-online',{code,token:NET.token,t:Date.now()});
  history.replaceState(null,'',location.pathname+'?room='+code);
  if(S){S.locked=true;S.busy=true}
  $('ffBtn').hidden=true;
  sheet(`<div class="kicker">Room ${esc(code)}</div><h3>Connecting…</h3><button class="btn full" data-net="leave">Cancel</button>`);
  netOpen();
}
function netOpen(){
  const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/api/rooms/'+NET.code+'/ws');NET.ws=ws;
  ws.onopen=()=>{ws.send(JSON.stringify({t:'join',name:store.get('junction-name')||'Player',token:NET.token}))};
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}NET.retry=0;netOnMsg(m)};
  ws.onclose=()=>{if(NET.ws!==ws)return;NET.ws=null;if(!NET.on||NET.closing)return;NET.retry++;
    setTimeout(()=>{if(NET.on&&!NET.ws)netOpen()},Math.min(8000,500*2**Math.min(NET.retry,4)))};
}
const netSend=o=>{if(NET.ws&&NET.ws.readyState===1){NET.ws.send(JSON.stringify(o));return true}return false};
function netAct(a){if(!netSend({t:'act',a})){feedLine('Not connected. Reconnecting…','danger');return}if(S)S.busy=true;render()}
function netOnMsg(m){
  if(m.t==='sync'){
    NET.skew=m.now-Date.now();NET.room=m.room;
    if(m.room.token&&m.room.token!==NET.token){NET.token=m.room.token;store.set('junction-online',{code:NET.code,token:NET.token,t:Date.now()})}
    if(m.room.phase==='lobby'||!m.v){if(NET.v){NET.v=null;NET.gameKey=null}netLobby();return}
    netApply(m.v,m.ev||[]);
  }
  else if(m.t==='pos')netPos(m.s,m.x,m.z);
  else if(m.t==='emote')netEmote(m);
  else if(m.t==='err')feedLine(m.msg,'danger');
  else if(m.t==='bye')netLeave(m.msg,m.keep);
}
function netLeave(msg,keepSeat){
  NET.closing=true;if(NET.ws){try{NET.ws.close()}catch(e){}}
  Object.assign(NET,{on:false,ws:null,v:null,room:null,gameKey:null,sig:'',offerKey:null,tunKey:null});
  if(!keepSeat)store.del('junction-online');history.replaceState(null,'',location.pathname);
  PLAYERS.length=0;PLAYERS0.forEach(p=>PLAYERS.push({...p}));rebuildRobots();
  ACT.forEach(A=>{A.remote=false;A.still=false;A.spd=undefined});
  $('ffBtn').hidden=false;$('netbar').hidden=true;
  newGame(18,true);openStart();
  if(msg)feedLine(msg,'danger');
}

  const link=location.origin+location.pathname+'?room='+R.code,humans=R.seats.filter(Boolean).length;
  sheet(`<div class="kicker">Online room · ${R.host?'you’re the host':'waiting for the host'}</div><h3>Room <span class="code">${esc(R.code)}</span></h3>
  <p>Send friends this link, or the code. Up to 4 players.</p>
  <div class="share"><input readonly id="netLink" value="${esc(link)}" aria-label="Invite link"><button class="btn" data-net="copy">Copy</button>${navigator.share?'<button class="btn" data-net="share">Share</button>':''}</div>
  <div class="seats">${[0,1,2,3].map(i=>{const s=R.seats[i];return `<div class="seat ${s?'':'empty'}">${sprocket(SEATC[i])}<span class="sn">${s?esc(s.name)+(i===R.you?' (you)':''):'A robot plays here'}</span>${s&&s.host?'<span class="tag">Host</span>':''}${s&&!s.online?'<span class="off">offline</span>':''}</div>`}).join('')}</div>
  <div class="kicker">Game length</div>
  <div class="modes">${Object.entries(R.modes).map(([k,m])=>`<button class="btn ${k===R.mode?'sel':''}" data-netmode="${k}" ${R.host?'':'disabled'} aria-pressed="${k===R.mode}">${esc(m.name)} · ${esc(m.blurb)}<small>${m.trains} trains · ${m.turnSec}s turns · ${m.clockMin} min clock</small></button>`).join('')}</div>
  ${R.host?`<button class="btn primary full" data-net="start">Start the game${humans<4?` <small>(robots take ${4-humans} seat${4-humans>1?'s':''})</small>`:''}</button>`:note('The host starts the game when everyone’s in.')}
  <button class="btn full" data-net="leave">Leave room</button>`);
  render();
}

/* ---- a game sync from the server ---- */
function netApply(v,ev){
  NET.v=v;
  if(NET.gameKey!==v.startedAt){ // a new game (or the first sync after joining one)
    NET.gameKey=v.startedAt;NET.logN=Math.max(0,(v.logN||0)-3);NET.finalShown=v.over;NET.offerKey=null;NET.tunKey=null;NET.keep=new Set();
    $('feed').innerHTML='';resetActors();if(sheetOpen())$('sheet').classList.add('hidden');
  }
  const sig=v.players.map(p=>p.name+p.col).join('|');
  if(sig!==NET.sig){NET.sig=sig;PLAYERS.length=0;v.players.forEach((p,i)=>PLAYERS.push({id:i,name:i?p.name:'You',col:p.col,human:i===0}));rebuildRobots()}
  const me=v.players[0].name,prev=S&&S.net?S:null;
  S={net:true,deck:new Array(v.deckN),discard:new Array(v.discardN),market:v.market.slice(),marketCity:v.marketCity.slice(),ticketDeck:new Array(v.ticketDeckN),
     turn:v.turn,round:v.round,drawn:v.drawn,over:v.over,lastTurns:v.lastTurns,busy:v.phase!=='play'||v.turn!==0||v.over,locked:false,
     selected:prev?prev.selected:null,routeOpts:prev&&prev.routeOpts,cityOpts:prev&&prev.cityOpts,curCity:prev&&prev.curCity,
     stationAt:v.stationAt,startTrains:0,log:v.log.map(l=>({t:personal(l.t,me),k:l.k})),offer:null,pending:null,
     routes:ROUTES.map((r,i)=>({...r,owner:v.owners[i]})),
     players:v.players.map((p,i)=>({id:i,name:i?p.name:'You',col:p.col,human:i===0,bot:p.bot,away:p.away,choosing:p.choosing,
       hand:p.hand||{_:p.handN},trains:p.trains,stations:p.stations,tickets:p.tickets||[],ticketsN:p.ticketsN}))};
  const fresh=Math.min((v.logN||0)-NET.logN,6);for(let i=fresh-1;i>=0;i--)if(S.log[i])feedLine(S.log[i].t,S.log[i].k);NET.logN=v.logN||0;
  ev.forEach(netEvent);
  if(v.offer){
    const key=JSON.stringify(v.offer.list);S.offer={...v.offer,keep:NET.keep};S.locked=true;
    if(key!==NET.offerKey){NET.offerKey=key;NET.keep=new Set();S.offer.keep=NET.keep;renderTicketChoice();SND.ready&&SND.fx.ticket()}
  }else if(NET.offerKey){NET.offerKey=null;if(sheetOpen()&&$('sheetBody').querySelector('[data-keep]'))closeSheet(true)}
  if(v.pending&&v.pending.mine){
    S.pending=v.pending;S.locked=true;const key=v.pending.ri+'|'+v.pending.rev.join();
    if(key!==NET.tunKey){NET.tunKey=key;netTunnel(v.pending)}
  }else if(NET.tunKey){NET.tunKey=null;if(sheetOpen()&&$('sheetBody').querySelector('[data-tunnel]'))closeSheet(true)}
  render();
  if(v.over&&!NET.finalShown){NET.finalShown=true;setTimeout(netFinal,1200)}
}
function netEvent(e){
  const A=ACT[e.s];
  if(e.k==='goto'&&e.s!==0&&A){A.path=planTo(A,e.x,e.z)}
  else if(e.k==='pick')fx.pickup(e.city,e.c);
  else if(e.k==='claim')fx.hop(e.s);
  else if(e.k==='puff')fx.puff(...routeMid(ROUTES[e.ri]));
  else if(e.k==='tunnel'&&e.s===0)SND.ready&&SND.fx.tunnel(e.extra>0);
  else if(e.k==='turn'&&e.s===0)SND.ready&&SND.fx.yourTurn();
  else if(e.k==='final')SND.ready&&SND.fx.finalRound();
  else if(e.k==='deck'&&e.s===0)SND.ready&&SND.fx.deck();
}
function netTunnel(P){
  const r=ROUTES[P.ri],o=P.o;
  const cards=P.rev.map(c=>cardHTML(c,'',(c==='loco'||(o.c!=='loco'&&c===o.c))?'hitc':'')).join('');
  sheet(`<div class="kicker">Tunnel: ${nm(r.a)} to ${nm(r.b)}</div><h3>Flipping 3 cards</h3><div class="reveal">${cards}</div>
  <p>${P.extra} card${P.extra>1?'s':''} matched, so this tunnel costs ${P.extra} more.</p><button class="btn primary full" data-tunnel="go">Pay ${payLabel(P.ex)}</button><button class="btn full" data-tunnel="back">Back off and keep your cards</button>`);
}
function netFinal(){
  const v=NET.v;if(!v||!v.final)return;
  const R=NET.room,rows=v.final,who=s=>s===0?'You':esc(v.players[s].name),w=rows[0];
  const ex=rows.filter(r=>r.ex).map(r=>who(r.s));
  sheet(`<div class="kicker">Final scores · ${NET_MODES[v.mode]?NET_MODES[v.mode].name:''} · room ${esc(R?R.code:'')}</div><h3>${w.s===0?'You win!':who(w.s)+' wins'}</h3>
  <p>Longest continuous route: ${v.maxL} trains, held by ${ex.join(' and ')} for +10.</p>
  <table class="score"><tr><th>Player</th><th>Routes</th><th>Tickets</th><th>Stations</th><th>Longest</th><th>Total</th></tr>
  ${rows.map(r=>`<tr><td><span class="who">${sprocket(v.players[r.s].col)}${who(r.s)}</span></td><td>${r.rp}</td><td>${r.tp>0?'+':''}${r.tp}</td><td>+${r.st}</td><td>${r.ex?'+10':'0'}</td><td class="tot">${r.total}</td></tr>`).join('')}
  </table>
  <ul class="tixlist">${rows.map(r=>`<li><b>${who(r.s)}:</b> ${(v.players[r.s].tickets||[]).map((t,i)=>`<span class="${r.det[i]?'ok':'bad'}">${r.det[i]?'✓':'✗'} ${nm(t.a)}–${nm(t.b)} (${t.p})</span>`).join(' · ')||'no tickets'}</li>`).join('')}</ul>
  ${R&&R.host?'<button class="btn primary full" data-net="again">Play again in this room</button>':note('The host can start another game in this room.')}
  <button class="btn full" data-net="leave">Leave room</button>${closeBtn()}`);
}

/* ---- other players' robots ---- */
function netPos(s,x,z){
  const A=ACT[s];if(!A||s===0||!NET.v)return;
  A.remote=true;A.still=true;
  if(Math.hypot(A.x-x,A.z-z)>45){A.x=x;A.z=z;A.path=null}else A.path=[[x,z]];
}
function netEmote(m){
  const s=NET.v?m.s:-1,who=s===0?'You':esc(m.name);
  feedLine(`${who}: ${m.e}`);
  if(s>=0&&ROBOTS[s]){const sp=labelSprite(m.e,{bg:'#ffffff',size:2.2});sp.position.y=8.4;ROBOTS[s].root.add(sp);
    setTimeout(()=>{ROBOTS[s]&&ROBOTS[s].root.remove(sp);sp.material.map.dispose();sp.material.dispose()},2600)}
}

/* ---- the room bar: code, turn timer, game clock, emotes (refreshed with the HUD, 10 times a second) ---- */
$('nbEmotes').innerHTML=EMOTES.map(e=>`<button class="nb em" data-emote="${e}" aria-label="Send ${e}">${e}</button>`).join('');
$('nbEmotes').addEventListener('click',e=>{const b=e.target.closest('[data-emote]');if(b)netSend({t:'emote',e:b.dataset.emote})});
$('nbRoom').onclick=()=>{if(!NET.on)return;if(!NET.v)return netLobby();if(NET.v.over)return netFinal();
  sheet(`<div class="kicker">Online room</div><h3>Room <span class="code">${esc(NET.code)}</span></h3><p>${NET_MODES[NET.v.mode].name} game, round ${NET.v.round}. If you leave, a robot takes over your seat.</p>
  <div class="share"><input readonly value="${esc(location.origin+location.pathname+'?room='+NET.code)}" aria-label="Invite link"><button class="btn" data-net="copy">Copy</button></div>
  <button class="btn full" data-net="leave">Leave room</button>${closeBtn()}`)};
function netBar(){
  const b=$('netbar');if(b.hidden===NET.on){b.hidden=!NET.on;const tb=$('hudTop').getBoundingClientRect().bottom+8;$('hudLeft').style.top=tb+'px'}
  if(!NET.on)return;
  const R=NET.room,v=NET.v;let turn,clock='',hot=false;
  if(!NET.ws)turn='Reconnecting…';
  else if(!v)turn=R?`Lobby · ${R.seats.filter(Boolean).length}/4 players`:'Connecting…';
  else if(v.over)turn='Game over · tap Room for scores';
  else{const now=netNow();
    if(v.phase==='tickets')turn=`Choosing tickets · ${Math.max(0,Math.ceil((v.ticketEnds-now)/1000))}s`;
    else{const sec=Math.max(0,Math.ceil((v.turnEnds-now)/1000)),p=v.players[v.turn];turn=`${v.turn===0?'Your turn':p.name+(p.bot?' 🤖':'')} · ${sec}s`;hot=v.turn===0&&sec<=5}
    clock=v.lastTurns!==null?'Final round':'🕒 '+mmss(Math.max(0,v.clockEnds-now))}
  const key=[R&&R.code,turn,clock,hot].join('|');if(key===NET.barKey)return;NET.barKey=key;
  $('nbRoom').textContent='Room '+(R?R.code:NET.code||'');$('nbTurn').textContent=turn;$('nbTurn').classList.toggle('hot',hot);
  $('nbClock').textContent=clock;$('nbClock').hidden=!clock;
}
function netStep(){
  netBar();
  const v=NET.v;if(!v||v.over)return;
  const k=v.mode==='blitz'?1.35:1;
  ACT.forEach((A,i)=>{const p=S.players[i];if(!p)return;
    A.spd=i===0?24*k:p.bot?(S.turn===i?(v.mode==='blitz'?90:60)*1.1:undefined):34*k;
    if(p.bot){A.remote=false;A.still=false}});
  const A=ACT[0],t=performance.now();
  if((!NET.lastPos||Math.hypot(A.x-NET.lastPos[0],A.z-NET.lastPos[1])>.5)&&t-NET.posT>100){NET.lastPos=[A.x,A.z];NET.posT=t;netSend({t:'pos',x:+A.x.toFixed(1),z:+A.z.toFixed(1)})}
}
function netStatus(){
  const v=NET.v,st=$('status');let t,c='status';
  if(v.over){c+=' wait';t='Game over. Tap Room for the scores.'}
  else if(S.offer)t='Choose which tickets to keep.';
  else if(v.phase==='tickets'){c+=' wait';const n=v.players.filter(p=>p.choosing).length;t=`Waiting for ${n} player${n>1?'s':''} to choose tickets…`}
  else if(S.pending)t='Tunnel! Pay the extra or back off.';
  else if(v.turn!==0){c+=' wait';const p=v.players[v.turn];t=`${esc(p.name)}${p.bot?' (robot)':p.away?' (away, a robot is helping)':''} is ${v.lastTurns!==null?'playing their final turn':'on the move'}… explore while you wait.`}
  else if(S.busy){c+=' wait';t='Sending…'}
  else return; // your turn: the usual instructions
  st.className=c+(v.lastTurns!==null&&!v.over?' final':'');st.innerHTML='<span class="dot"></span>'+t;
}
function netReshow(){
  if(!NET.on||sheetOpen())return;
  if(!NET.v){if(NET.room)netLobby();return}
  if(S.offer)renderTicketChoice();else if(S.pending)netTunnel(S.pending);
}

/* ---- online versions of your actions: send them, the server answers with a sync ---- */
{const f=takeMarket;takeMarket=function(i){if(!NET.on)return f(i);if(!canAct())return;const c=S.market[i];if(!c)return;
  if(c==='loco'&&S.drawn===1){feedLine('A floating locomotive can’t be your second card.','danger');return}netAct({t:'market',i})}}
{const f=takeDeck;takeDeck=function(){if(!NET.on)return f();if(!canAct()||!(S.deck.length+S.discard.length))return;netAct({t:'deck'})}}
{const f=startClaim;startClaim=function(ri,o){if(!NET.on)return f(ri,o);if(!canAct()||!o)return;closeSheet(true);netAct({t:'claim',ri,o:{c:o.c,n:o.n,w:o.w}})}}
{const f=tunnelResolve;tunnelResolve=function(go){if(!NET.on)return f(go);S.pending=null;S.locked=false;closeSheet(true);netAct({t:'tunnel',go})}}
{const f=buildStation;buildStation=function(j){if(!NET.on)return f(j);const o=S.cityOpts&&S.cityOpts[j];if(!o||!canAct())return;closeSheet(true);netAct({t:'station',city:S.curCity,o:{c:o.c,n:o.n,w:o.w}})}}
{const f=confirmTickets;confirmTickets=function(){if(!NET.on)return f();const{keep,min,list}=S.offer;if(keep.size<min)return;
  const idx=[...keep].filter(i=>i<list.length);S.offer=null;S.locked=false;closeSheet(true);netAct({t:'keep',idx})}}
{const f=drawTicketsHuman;drawTicketsHuman=function(){if(!NET.on)return f();if(!canAct()||S.drawn||!S.ticketDeck.length)return;netAct({t:'tickets'})}}
$('tixBtn').onclick=()=>drawTicketsHuman();
{const f=render;render=function(){f();if(NET.on&&NET.v&&S&&S.net)netStatus();else if(NET.on){const st=$('status');st.className='status wait';st.innerHTML=`<span class="dot"></span>${NET.room?'Online lobby: room '+esc(NET.room.code):'Connecting…'}`}}}
{const f=closeSheet;closeSheet=function(force){f(force);if(NET.on&&!sheetOpen())setTimeout(netReshow,0)}}
{const f=stepUI;stepUI=function(){f();if(NET.on)netStep()}}
{const f=endGame;endGame=function(){f();const m=$('sheetBody').querySelector('.modes');if(m&&!NET.on)m.outerHTML=soloModesHTML()}}
sheetEl.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;
  if(d.pickmode){NET.pickMode=d.pickmode;$('sheetBody').querySelectorAll('[data-pickmode]').forEach(x=>{const on=x.dataset.pickmode===d.pickmode;x.classList.toggle('sel',on);x.setAttribute('aria-pressed',on)})}
  else if(d.netmode)netSend({t:'mode',mode:d.netmode});
  else if(d.net){const k=d.net;
    if(k==='online')onlineSheet();
    else if(k==='joincode')onlineSheet('',true);
    else if(k==='rejoin'){const st=store.get('junction-online');if(st)netConnect(st.code,st.token)}
    else if(k==='create')netCreate();
    else if(k==='join')netJoin();
    else if(k==='back')openStart();
    else if(k==='start')netSend({t:'start'});
    else if(k==='again')netSend({t:'again'});
    else if(k==='leave'){netSend({t:'leave'});netLeave('')}
    else if(k==='copy'){const i=b.parentElement.querySelector('input'),done=()=>{b.textContent='Copied!';setTimeout(()=>b.textContent='Copy',1600)};
      if(navigator.clipboard)navigator.clipboard.writeText(i.value).then(done,()=>{i.select();document.execCommand('copy');done()});else{i.select();document.execCommand('copy');done()}}
    else if(k==='share')navigator.share({title:'Junction 3D',text:`Join my Junction room ${NET.code}`,url:location.origin+location.pathname+'?room='+NET.code}).catch(()=>{});
  }
});
sheetEl.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.id==='netCode'){e.preventDefault();netJoin()}else if(e.target.id==='netName'){e.preventDefault();($('netCode').value.trim()?netJoin:netCreate)()}});
function netBoot(){ // ?room=ABCD opens the join form (or rejoins your seat)
  if(!ONLINE_OK)return false;
  const q=new URLSearchParams(location.search).get('room');if(!q)return false;
  const code=q.toUpperCase().replace(/[^A-Z]/g,'').slice(0,4);
  if(!canOnline()){onlineSheet(code);return true}
  const st=store.get('junction-online');
  if(st&&st.code===code&&st.token&&store.get('junction-name')){netConnect(code,st.token);return true}
  onlineSheet(code,true);return true;
}

/* ---- boot ---- */
async function boot(){
  try{await Promise.race([Promise.all([document.fonts.load('800 46px Nunito'),document.fonts.load('700 20px Fredoka')]),new Promise(r=>setTimeout(r,2500))])}catch(e){}
  if(innerWidth<innerHeight)CAM.dist=CAM.cur=140;
  buildCities();buildRoutes();buildCards();
  PLAYERS.forEach(p=>ROBOTS.push(makeRobot(p)));
  newGame(20,true);if(!netBoot())openStart();
  $('boot').remove();
  requestAnimationFrame(loop);
}
boot();

/* hooks for automated tests (bots play every seat headlessly with FAST=true) */
const v3=new THREE.Vector3();
window.J={get S(){return S},newGame,botTurn,endTurn,H,ACT,walkTo,interactions,takeMarket,openRoute,openCity,payOptions,startClaim,CAM,
  botSabotage,openMeeting,vote,answer,reward,openLog,meetingOpen,humanMeeting,runMeeting,botWantsMeeting,SND,nearestCity,W,routeMid,ROBOTS,fx,world,
  dir:{start(t=0){DIR.on=true;DIR.t=t},stop(){DIR.on=false;DIR.cam=null},
    step(dt){DIR.t+=dt;update(dt,DIR.t);renderer.render(scene,camera)},
    cam(pos,look,fov){DIR.cam=pos?{pos,look,fov}:null},
    hud(v){document.querySelectorAll('.hud').forEach(e=>e.style.visibility=v?'':'hidden')},
    grab(type='image/jpeg',q=.92){renderer.render(scene,camera);return renderer.domElement.toDataURL(type,q)},
    project(pid,dy=2.9){const R=ROBOTS[pid];R.root.updateMatrixWorld();v3.set(0,dy,1.5).applyMatrix4(R.root.matrixWorld).project(camera);return[(v3.x+1)/2*innerWidth,(1-v3.y)/2*innerHeight]},
    projectXZ(x,y,z){v3.set(x,y,z).project(camera);return[(v3.x+1)/2*innerWidth,(1-v3.y)/2*innerHeight]},
    get t(){return DIR.t}},
  setFast:v=>{FAST=v},render,canAct,walkable,planTo};
window.JN={get NET(){return NET},get S(){return S},netSend,ACT,interactions,useNow,openRoute,openCity,payOptions,stationOptions,H,canAct,
  takeMarket:i=>takeMarket(i),takeDeck:()=>takeDeck(),startClaim:(ri,o)=>startClaim(ri,o),tunnelResolve:g=>tunnelResolve(g),confirmTickets:()=>confirmTickets(),drawTickets:()=>drawTicketsHuman()};
